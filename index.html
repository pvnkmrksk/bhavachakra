<style>
:root{
  /* soapstone, the green-grey of Hoysala chloritic schist */
  --ground:#E6E9E2; --plate:#F1F3ED; --sunk:#DBDFD4;
  --ink:#191E1A; --ink-2:#4A534B; --ink-3:#7C857C;
  --rule:#C9CFC2; --rule-soft:#D9DED2;
  --accent:#A8791A; --accent-soft:#EFE3C6;
  --mixer:#FFFFFF; --mix-mid:62%; --mix-leaf:40%;
  --leaf-ink:#1C221D; --mid-ink:#161A17; --core-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(25,30,26,.07), 0 8px 28px -12px rgba(25,30,26,.22);
  /* ಭಾವಚಕ್ರ, turmeric, peacock, neem, indigo, kumkum, lac, deep blue */
  --bhava-0:#9C6E0C; --bhava-1:#16696E; --bhava-2:#64744A; --bhava-3:#43478E;
  --bhava-4:#A53426; --bhava-5:#723A6D; --bhava-6:#26597F;
  /* ಒಡಲ ಚಕ್ರ, the seats of the body */
  --odalu-0:#A6384A; --odalu-1:#946E10; --odalu-2:#7A2B45; --odalu-3:#3C4890;
  --odalu-4:#146A75; --odalu-5:#6A3F8E; --odalu-6:#586B3E;
  /* ರಸಚಕ್ರ: after the colours the Nāṭyaśāstra assigns each rasa */
  --rasa-0:#3E7A4E; --rasa-1:#8E7413; --rasa-2:#5A6B7A; --rasa-3:#A52D26;
  --rasa-4:#9A6E12; --rasa-5:#3A3B63; --rasa-6:#1F5F86; --rasa-7:#A65A14;
  --rasa-8:#7C7F74;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12160F; --plate:#1A1F19; --sunk:#0D110B;
    --ink:#E4E8DD; --ink-2:#A8B1A4; --ink-3:#79826F;
    --rule:#2B3229; --rule-soft:#232920;
    --accent:#D9A93C; --accent-soft:#332A14;
    --mixer:#0C0F0A; --mix-mid:54%; --mix-leaf:30%;
    --leaf-ink:#DDE2D6; --mid-ink:#EAEEE3; --core-ink:#0E120C;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 34px -14px rgba(0,0,0,.8);
    --bhava-0:#E2AC33; --bhava-1:#2AA0A5; --bhava-2:#93A56E; --bhava-3:#6E73C8;
    --bhava-4:#D45444; --bhava-5:#A75BA0; --bhava-6:#3D84BC;
    --odalu-0:#DE6B7C; --odalu-1:#D2A032; --odalu-2:#C0637F; --odalu-3:#6C77CE;
    --odalu-4:#2E9BA6; --odalu-5:#A177CE; --odalu-6:#94AB6C;
    --rasa-0:#62B27C; --rasa-1:#E0C24A; --rasa-2:#93A6B6; --rasa-3:#DE5A4C;
    --rasa-4:#DDA83A; --rasa-5:#7A7CC4; --rasa-6:#3F92C4; --rasa-7:#E2913C;
    --rasa-8:#B4B8A9;
  }
}
:root[data-theme="dark"]{
  --ground:#12160F; --plate:#1A1F19; --sunk:#0D110B;
  --ink:#E4E8DD; --ink-2:#A8B1A4; --ink-3:#79826F;
  --rule:#2B3229; --rule-soft:#232920;
  --accent:#D9A93C; --accent-soft:#332A14;
  --mixer:#0C0F0A; --mix-mid:54%; --mix-leaf:30%;
  --leaf-ink:#DDE2D6; --mid-ink:#EAEEE3; --core-ink:#0E120C;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 34px -14px rgba(0,0,0,.8);
  --bhava-0:#E2AC33; --bhava-1:#2AA0A5; --bhava-2:#93A56E; --bhava-3:#6E73C8;
  --bhava-4:#D45444; --bhava-5:#A75BA0; --bhava-6:#3D84BC;
  --odalu-0:#DE6B7C; --odalu-1:#D2A032; --odalu-2:#C0637F; --odalu-3:#6C77CE;
  --odalu-4:#2E9BA6; --odalu-5:#A177CE; --odalu-6:#94AB6C;
  --rasa-0:#62B27C; --rasa-1:#E0C24A; --rasa-2:#93A6B6; --rasa-3:#DE5A4C;
  --rasa-4:#DDA83A; --rasa-5:#7A7CC4; --rasa-6:#3F92C4; --rasa-7:#E2913C;
  --rasa-8:#B4B8A9;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:'Anek Latin','Anek Kannada',system-ui,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Spectral','Noto Serif Kannada',Georgia,serif}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px}
h1,h2,h3{margin:0; font-weight:600; text-wrap:balance; line-height:1.18}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:3px}
.eyebrow{font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:600}

.top{padding:clamp(14px,2.5vw,26px) 24px 0; max-width:1340px; margin:0 auto}

/* ---------- wheel switcher ---------- */
.switcher .track{position:relative; display:grid; grid-template-columns:repeat(3,1fr);
  background:var(--sunk); border:1px solid var(--rule); border-radius:3px; padding:4px}
.thumb{position:absolute; z-index:0; left:4px; top:4px; bottom:4px; width:calc((100% - 8px)/3);
  background:var(--plate); border:1px solid var(--rule); border-radius:2px;
  box-shadow:var(--shadow); transition:transform .38s cubic-bezier(.3,.8,.3,1)}
.opt{position:relative; z-index:1; appearance:none; background:none; border:0; cursor:pointer;
  font:inherit; color:var(--ink-3); padding:10px 8px; text-align:center; line-height:1.25;
  transition:color .25s}
.opt b{display:block; font-family:'Noto Serif Kannada',serif; font-size:18px; font-weight:600}
.opt span{display:block; font-size:11px; letter-spacing:.03em; margin-top:1px}
.opt[aria-selected="true"]{color:var(--ink)}

/* ---------- caption + language slider ---------- */
.bar{display:flex; align-items:center; gap:16px; margin:14px 0 10px; flex-wrap:wrap}
.tag{flex:1 1 260px; min-width:0; font-family:'Spectral',Georgia,serif; font-size:14.5px;
  color:var(--ink-2); line-height:1.45}
.lang{position:relative; appearance:none; border:1px solid var(--rule); cursor:pointer;
  background:var(--sunk); border-radius:999px; padding:3px; display:grid;
  grid-template-columns:1fr 1fr; font:inherit; width:178px; flex:none}
.lthumb{position:absolute; z-index:0; top:3px; bottom:3px; left:3px; width:calc(50% - 3px);
  background:var(--plate); border:1px solid var(--rule); border-radius:999px;
  transition:transform .3s cubic-bezier(.3,.8,.3,1)}
.lang[aria-checked="true"] .lthumb{transform:translateX(100%)}
.lopt{position:relative; z-index:1; padding:5px 4px; font-size:13px; font-weight:500;
  color:var(--ink-3); text-align:center; transition:color .25s}
.lopt:first-of-type{font-family:'Noto Serif Kannada',serif}
.lopt.on{color:var(--ink)}

/* ---------- wheel ---------- */
.stage{display:grid; grid-template-columns:300px minmax(0,1fr) 300px; gap:26px;
  align-items:start; justify-items:center}
.stage::before{content:''}
.wheelbox{grid-column:2; width:100%; max-width:min(100%,72vh)}
.wheelbox{position:relative}
.skip{position:absolute; left:0; top:0; z-index:4; font-size:13px; padding:6px 12px;
  background:var(--plate); color:var(--ink); border:1px solid var(--accent); border-radius:2px;
  transform:translateY(-140%); opacity:0}
.skip:focus{transform:none; opacity:1}
.zoomout{position:absolute; z-index:3; left:0; top:0; appearance:none; font:inherit;
  font-size:13px; font-weight:500; cursor:pointer; background:var(--plate); color:var(--ink-2);
  border:1px solid var(--rule); border-radius:999px; padding:7px 15px; box-shadow:var(--shadow);
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.zoomout:hover{border-color:var(--accent); color:var(--accent)}
.zoomout[hidden]{display:none}
svg.wheel{width:100%; height:auto; display:block; touch-action:manipulation; overflow:hidden}
svg.wheel g.seg{cursor:pointer}
/* The `d` transition is for the hover lift, and only a mouse can hover. On a
   touchscreen it was pure cost: drilling animates `d` from JavaScript on every
   frame, and a CSS transition on the same attribute makes the browser
   interpolate all 117 paths again on top of that, on the one thread a phone
   can least spare. Animating `d` is not composited, so none of it is free. */
svg.wheel g.seg path{transition:opacity .2s ease}
@media (hover:hover) and (pointer:fine){
  svg.wheel g.seg path{transition:opacity .2s ease, d .22s cubic-bezier(.22,.8,.3,1)}
}
svg.wheel g.seg:focus,svg.wheel g.seg:focus-visible{outline:none}
svg.wheel g.seg{transition:opacity .18s ease}
svg.wheel g.seg text{transition:opacity .2s ease}
svg.wheel g.seg:focus-visible path,svg.wheel g.seg.sel path{stroke:var(--ink); stroke-width:2.5}
svg.wheel .hubdisc{cursor:pointer; transition:fill .2s}
svg.wheel .hubdisc:hover{fill:var(--sunk)}
svg.wheel text{pointer-events:none; user-select:none;
  font-family:'Anek Kannada','Anek Latin',sans-serif}
svg.wheel.dimmed g.seg:not(.on) path{opacity:.34}
svg.wheel.dimmed g.seg:not(.on) text{opacity:.42}
svg.wheel .hublabel{pointer-events:none; user-select:none}
svg.wheel .hublabel text{font-family:'Anek Kannada','Anek Latin',sans-serif}
svg.wheel .hublabel .hw{font-family:'Noto Serif Kannada',serif; font-weight:600; fill:var(--ink)}
svg.wheel .hublabel .hr{fill:var(--ink-3); font-style:italic;
  font-family:'Spectral',Georgia,serif}
svg.wheel .hublabel .he{fill:var(--ink-2); font-weight:500}
svg.wheel .hublabel .hb{fill:var(--accent); font-weight:500}

/* ---------- detail ---------- */
/* overscroll-behavior:contain here was eating the gesture: when the panel has
   less content than height it is still a scroll container, so a drag that
   started inside it had nowhere to go and was not allowed to reach the page.
   Let it chain, and below 900px stop being a scroll container at all.       */
.detail{grid-column:3; justify-self:stretch; background:var(--plate); border:1px solid var(--rule); border-radius:2px;
  padding:20px; box-shadow:var(--shadow); position:sticky; top:16px;
  max-height:calc(100vh - 32px); overflow-y:auto}
.detail .crumb{font-size:12px; color:var(--ink-3); margin-bottom:12px; line-height:1.5}
.detail .crumb b{color:var(--ink-2); font-weight:600; font-size:13px}
.detail .crumb i{font-style:normal; opacity:.75}
.detail .crumb em{font-style:normal; margin:0 6px; opacity:.5}
.detail .word{font-family:'Noto Serif Kannada',serif; font-weight:600;
  font-size:31px; line-height:1.25; margin-bottom:3px; overflow-wrap:anywhere}
.detail .rom{font-size:14px; color:var(--ink-2); font-style:italic; font-family:'Spectral',serif}
.detail .means{font-size:17px; color:var(--ink); margin-top:8px; font-weight:500}
.detail .lit{font-size:13.5px; color:var(--ink-3); margin-top:3px;
  font-family:'Spectral',serif; font-style:italic}
.also{margin-top:14px; padding-top:13px; border-top:1px solid var(--rule-soft)}
.also h4{font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);
  font-weight:600; margin:0 0 8px}
.also ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px}
.also li{font-size:13.5px; line-height:1.4}
.also li b{font-family:'Noto Serif Kannada',serif; font-weight:600; color:var(--ink); font-size:15px}
.also li i{font-family:'Spectral',serif; color:var(--ink-3); margin:0 5px}
.also li span{color:var(--ink-2)}
.detail .note{font-family:'Spectral',Georgia,serif; font-size:14.5px; line-height:1.6;
  color:var(--ink-2); margin-top:14px; padding-top:13px; border-top:1px solid var(--rule-soft)}
.detail .note i,.detail .note em{color:var(--ink)}
.hint{color:var(--ink-3); font-size:14.5px; font-family:'Spectral',serif; font-style:italic;
  line-height:1.6}

/* ---------- phone ---------- */
@media (max-width:900px){
  .top{padding-left:14px; padding-right:14px}
  .wheelbox{margin:0 -6px}
  /* the panel sits under the wheel rather than over it; the wheel is capped so
     both are reachable without much scrolling, and the hub answers most taps */
  .stage{grid-template-columns:1fr}
  .stage::before{display:none}
  .wheelbox{grid-column:1; width:100%; max-width:min(100%,52vh); margin:0 auto}
  .detail{grid-column:1; position:static; max-height:none; margin-top:12px; border-radius:8px;
    overflow:visible}                 /* never a scroll container on a phone */
  .deck{width:96px; height:96px}      /* smaller to paint, still rendering */
  .deck iframe{width:96px; height:96px}
  #ytdeck1{margin-top:-96px}
  .detail .word{font-size:26px}
  .detail .means{font-size:16px}
  .zoomout{font-size:12px; padding:6px 12px}
  .opt b{font-size:15px}
  .opt span{font-size:9.5px}
  .lang{width:158px; margin-left:auto}
  .tag{flex-basis:100%; font-size:13.5px; margin-bottom:-2px}
  .bar{gap:8px; margin:10px 0 8px}
}

/* ---------- prose, below the wheel ---------- */
section{padding:clamp(44px,6vw,80px) 0 0}
.shead{display:flex; flex-direction:column; gap:12px; max-width:66ch}
.shead h1{font-family:'Noto Serif Kannada',serif; font-weight:600;
  font-size:clamp(38px,6.5vw,64px); line-height:1.05; letter-spacing:-.01em}
.shead .sub{font-family:'Spectral',Georgia,serif; font-size:clamp(16px,1.9vw,19px);
  line-height:1.55; color:var(--ink-2)}
.shead .sub em{color:var(--ink); font-style:italic}
.sub2{margin-top:clamp(40px,5vw,64px); margin-bottom:30px}
.shead h2{font-family:'Noto Serif Kannada',serif; font-size:clamp(24px,3.6vw,34px)}
.shead h2 .lat{font-family:'Spectral',serif; font-style:italic; font-weight:400;
  color:var(--ink-3); font-size:.55em}
.shead p{font-family:'Spectral',Georgia,serif; font-size:16.5px; color:var(--ink-2)}
.method{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:26px 34px}
.method h3{font-size:13.5px; letter-spacing:.02em; margin-bottom:7px}
.method p{font-family:'Spectral',Georgia,serif; font-size:14.5px; color:var(--ink-2);
  line-height:1.62}
footer{margin-top:clamp(44px,6vw,76px); padding:24px 0 56px; border-top:1px solid var(--rule);
  color:var(--ink-3); font-size:13px; max-width:80ch}
footer a{color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
/* ------------------------------------------------------------- the song */
.song{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule-soft)}
.song .from{margin:0 0 10px;font-size:11.5px;color:var(--ink-3);line-height:1.4}
.song .from b{color:var(--ink-2);font-weight:500}
.song .play{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 12px;border:1px solid var(--rule);border-radius:11px;
  background:var(--plate);color:var(--ink);font:inherit;cursor:pointer;
  transition:border-color .2s,background .2s}
.song .play:hover{border-color:var(--accent)}
.song.on .play{border-color:var(--accent);background:var(--accent-soft)}
.song .glyph{flex:0 0 auto;width:17px;height:17px;position:relative}
.song .glyph::before{content:"";position:absolute;inset:0;margin:auto;
  width:0;height:0;border-left:12px solid var(--accent);
  border-top:8px solid transparent;border-bottom:8px solid transparent}
.song.on .glyph::before{width:12px;height:15px;border:0;background:var(--accent)}
.song .pt{display:flex;flex-direction:column;gap:2px;min-width:0}
.song .pt b{font-weight:600;font-size:14px;line-height:1.35}
.song .pt i{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.song .by{margin:8px 0 0;font-size:12px;color:var(--ink-2)}
.song .more{margin:6px 0 0;font-size:11.5px;color:var(--ink-3)}
.song .step{display:flex;align-items:center;gap:10px;margin-top:9px}
.song .step button{width:30px;height:30px;padding:0;border-radius:50%;
  border:1px solid var(--rule);background:var(--plate);color:var(--ink-2);
  font:400 16px/1 system-ui,sans-serif;cursor:pointer}
.song .step button:hover{border-color:var(--accent);color:var(--accent)}
.song .step .pos{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.song .snote{margin:8px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.song .src{display:inline-block;margin-top:10px;font-size:11.5px;color:var(--accent);
  text-decoration:none;border-bottom:1px solid transparent}
.song .src:hover{border-color:var(--accent)}
.song.borrowed .play{opacity:.82}
/* ------------------------------------------------------------- the player */
/* Deep transparent rather than moved off the page: an iframe parked outside
   the viewport is the first thing a browser throttles, and a throttled player
   is a silent one. This one is really there, really playing, and all but
   invisible. Nothing on the page can click it or focus it.                  */
.deck{position:fixed; right:8px; bottom:8px; z-index:0; width:200px; height:200px;
  opacity:.012; pointer-events:none; overflow:hidden; border-radius:10px}
.deck[hidden]{display:none}
.deck iframe{display:block; width:200px; height:200px; border:0}
#ytdeck1{margin-top:-200px}          /* the two decks share the one square */

/* the song, when it will not play */
.song .oops{margin:9px 0 0; font-size:12px; color:var(--ink-2); line-height:1.5}
.song .oops a{color:var(--accent); text-decoration:none;
  border-bottom:1px solid transparent}
.song .oops a:hover{border-color:var(--accent)}

/* cover: the video's own frame, which for a song upload is the sleeve */
.song .art{float:left; width:54px; height:54px; margin:0 12px 4px 0;
  border-radius:8px; object-fit:cover; background:var(--sunk)}

</style>

</head>
<body>
<div class="wrap top">
  <nav class="switcher" role="tablist" aria-label="Choose a wheel">
    <div class="track"><span class="thumb" id="thumb"></span>
      <button role="tab" class="opt" data-i="0" aria-selected="true">
        <b>ಭಾವಚಕ್ರ</b><span>from English</span></button>
      <button role="tab" class="opt" data-i="1" aria-selected="false">
        <b>ಒಡಲ ಚಕ್ರ</b><span>from the body</span></button>
      <button role="tab" class="opt" data-i="2" aria-selected="false">
        <b>ರಸಚಕ್ರ</b><span>from the rasas</span></button>
    </div>
  </nav>

  <div class="bar">
    <p class="tag" id="tag"></p>
    <button class="lang" id="langBtn" role="switch" aria-checked="false"
            aria-label="Wheel labels: Kannada or English">
      <span class="lthumb"></span>
      <span class="lopt on">ಕನ್ನಡ</span><span class="lopt">English</span>
    </button>
  </div>

  <div class="stage">
    <div class="wheelbox">
      <a class="skip" href="#about">Skip the wheel</a>
      <button class="zoomout" id="zoomOut" hidden></button>
      <svg class="wheel" id="wheel" viewBox="0 0 800 800" role="img"
           aria-label="An emotion wheel in Kannada"></svg>
    </div>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>
</div>

<main class="wrap" id="about">
<section>
  <div class="shead">
    <h1 id="mastTitle">ಭಾವಚಕ್ರ</h1>
    <p class="sub serif" id="mastSub"></p>
  </div>
  <div class="shead sub2">
    <h2 id="aboutTitle"></h2>
    <p id="aboutBody"></p>
  </div>
  <div class="method" id="aboutGrid"></div>

<script>
const WHEELS = [{"id":"bhava","hint":"Tap or hover any segment: the panel names it in both scripts and lists the words that did not fit. Tap a sector to zoom in, and the middle of the wheel to come back out.","blurb":"Seven core feelings, three rings, 130 words. The shape is borrowed from Gloria Willcox's Feeling Wheel, the one that circulates as a therapy handout. The Kannada in it is the word you would reach for out loud, with its close relatives listed beside it. Open a sector to read it.","aboutTitle":"ಎರವಲಿನ ಆಕಾರ","aboutLat":"a borrowed shape","about":"Seven cores, a slot called <em>Bad</em>, <em>ashamed</em> kept apart from <em>guilty</em>: those are English assumptions about where feeling divides. Filling them in Kannada is worth doing exactly where the two languages disagree, and they disagree often enough that the other two wheels start somewhere else instead.","cards":[{"h":"ಬೇಸರ does the work of four","p":"Bored, busy, stressed and tired are four separate slots on the English wheel. In Kannada they sit in one word. ಬೇಸರಾಗಿದೆ can be any of them, and the listener works out which from your face."},{"h":"Where one word covers two","p":"ನೋವು is bodily pain and hurt feelings without distinction: ಮನಸ್ಸಿಗೆ ನೋವಾಯಿತು, it hurt my mind, is the ordinary way to say you were wounded. ಚಿಂತೆ is worry and simply thought. ನಾಚಿಕೆ is shyness, modesty and shame at once."},{"h":"Where Kannada has six and a wedge has one","p":"Fear comes graded, ಅಂಜಿಕೆ, ಹೆದರಿಕೆ, ದಿಗಿಲು, ಗಾಬರಿ, ಆತಂಕ, ಭೀತಿ, and doubt four ways: ಶಂಕೆ leans toward fear, ಸಂಶಯ toward suspicion of a person, ಸಂದೇಹ toward uncertainty about a fact, ಅನುಮಾನ is the everyday one. The wheel shows one and keeps the rest under ಹೀಗೂ ಹೇಳುತ್ತಾರೆ."},{"h":"Where the wheel asks for something not there","p":"<em>Vulnerable</em> in its warm modern sense has no Kannada noun: ದುರ್ಬಲತೆ and ಸುಭೇದ್ಯ mean weak and breachable. Kannada puts it as something you do rather than something you are: ಮನಸ್ಸು ಬಿಚ್ಚು, to unfold the mind."}],"name":"ಭಾವಚಕ್ರ","hubKn":"ಭಾವಚಕ್ರ","hubRom":"bhāva-cakra","tag":"Seven core feelings, three rings: the English feeling wheel put into Kannada, seams and all.","data":[{"kn":"ಸಂತೋಷ","tr":"santōṣa","en":"Happy","kids":[{"kn":"ತುಂಟತನ","tr":"ṭuṇṭatana","en":"Playful","kids":[{"kn":"ಉದ್ರೇಕ","tr":"udrēka","en":"Aroused","kids":[],"note":"In Kannada ಉದ್ರೇಕ is not primarily erotic: a crowd, a temper and a nerve can all be ಉದ್ರಿಕ್ತ. It means charged, and the charge can go either way.","songs":[{"t":"ಚುಟು ಚುಟು","by":"","src":"ರಾಂಬೊ 2","yt":"mK9C6wViwn4","st":28}]},{"kn":"ಕೀಟಲೆ","tr":"kīṭale","en":"Cheeky","kids":[],"note":"Teasing you are allowed to do, which makes it a claim about the relationship.","songs":[{"t":"ಪ್ಯಾರ್ಗೆ ಆಗ್ಬಿಟ್ಟೈತೆ","by":"","src":"ಗೋವಿಂದಾಯ ನಮಃ","yt":"eccBCKBmJr0","st":28}]}],"note":"The mischief of a child you are not actually angry with.","songs":[{"t":"ಬೊಂಡ ನಾ ಬಜ್ಜಿ ನಾ","by":"","src":"ಕೋತಿಗಳು ಸಾರ್ ಕೋತಿಗಳು","yt":"63rWWFGLMMQ","st":34}]},{"kn":"ತೃಪ್ತಿ","tr":"tṛpti","en":"Content","kids":[{"kn":"ನಿರಾಳ","tr":"nirāḷa","en":"Free","kids":[],"note":"ಮುಕ್ತ and ಸ್ವತಂತ್ರ are freedoms of status: liberated, independent, tax-exempt. The <i>feeling</i> of free is ನಿರಾಳ: unclenched, the breath after the weight comes off.","songs":[{"t":"ಹಾಯಾಗಿದೆ ದಿನ ಮನ","by":"","src":"ತಾಯಿ ದೇವರು","yt":"p-V14XUHV_0","st":28}]},{"kn":"ಹಿಗ್ಗು","tr":"higgu","en":"Joyful","kids":[],"note":"To swell. Joy as something that expands you: the same verb for dough rising and for a chest filling.","songs":[{"t":"ಖುಷಿಯಾಗಿದೆ ಏಕೋ","by":"","src":"ತಾಜ್ ಮಹಲ್","yt":"ZuMN2L0xlLY","st":28}]}],"note":"The right word was in there, sitting under moisture content and table of contents. ತೃಪ್ತಿ is satiety: the feeling after a meal, and after a life.","songs":[{"t":"ಆದದ್ದೆಲ್ಲ ಒಳಿತೇ ಆಯಿತು","by":"","src":"ಪುರಂದರದಾಸರ ಪದ","yt":"duJPkITAj6Q","st":32}],"also":[{"kn":"ಸಂತೃಪ್ತಿ","tr":"santṛpti","en":"full satisfaction"},{"kn":"ತಣಿವು","tr":"taṇivu","en":"slaked"},{"kn":"ಸಮಾಧಾನ","tr":"samādhāna","en":"settledness"}]},{"kn":"ಆಸಕ್ತಿ","tr":"āsakti","en":"Interested","kids":[{"kn":"ಕುತೂಹಲ","tr":"kutūhala","en":"Curious","kids":[],"songs":[{"t":"ಎಲ್ಲೋ ಹುಡುಕಿದೆ ಇಲ್ಲದ ದೇವರ","by":"ಸಿ. ಅಶ್ವತ್ಥ್","src":"ಜಿ.ಎಸ್. ಶಿವರುದ್ರಪ್ಪ","yt":"qBAoqZOSMpM","st":25,"from":"ಆಸಕ್ತಿ"}]},{"kn":"ಕೆದಕು","tr":"kedaku","en":"Inquisitive","kids":[],"note":"ಕೆದಕು is to poke at a thing that was sitting quietly, and it keeps the faint rudeness English <i>inquisitive</i> also carries. ಜಿಜ್ಞಾಸೆ is the same impulse pointed at ideas rather than at people.","songs":[{"t":"ಎಲ್ಲಿರುವೆ ಮನವ ಕಾಡುವ ರೂಪಸಿಯೇ","by":"","src":"ಬಯಲು ದಾರಿ","yt":"Dkm1xvK7EUE","st":28}],"also":[{"kn":"ಜಿಜ್ಞಾಸೆ","tr":"jijñāse","en":"the wish to know"},{"kn":"ಕುತೂಹಲ","tr":"kutūhala","en":"curiosity"},{"kn":"ಶೋಧ","tr":"śōdha","en":"searching out"}]}],"songs":[{"t":"ಎಲ್ಲೋ ಹುಡುಕಿದೆ ಇಲ್ಲದ ದೇವರ","by":"ಸಿ. ಅಶ್ವತ್ಥ್","src":"ಜಿ.ಎಸ್. ಶಿವರುದ್ರಪ್ಪ","yt":"qBAoqZOSMpM","st":25}]},{"kn":"ಹೆಮ್ಮೆ","tr":"hemme","en":"Proud","kids":[{"kn":"ಸಾರ್ಥಕ","tr":"sārthaka","en":"Successful","kids":[],"note":"ಯಶಸ್ವಿ is the outcome: you won. ಸಾರ್ಥಕ is the feeling: it had meaning, it was worth it. Only one of those belongs on an emotion wheel.","songs":[{"t":"ಎದೆ ತುಂಬಿ ಹಾಡಿದೆನು","by":"","src":"ಭಾವಗೀತೆ","yt":"H-99yoLymF8","st":28}]},{"kn":"ಆತ್ಮವಿಶ್ವಾಸ","tr":"ātma-viśvāsa","en":"Confident","kids":[],"note":"Literally 'self-trust'. Kannada builds confidence out of the same root as trusting another person.","songs":[{"t":"ಆಗದು ಎಂದು ಕೈಲಾಗದು ಎಂದು","by":"ರಾಜನ್-ನಾಗೇಂದ್ರ · ಪಿ.ಬಿ.ಎಸ್","src":"ಬಂಗಾರದ ಮನುಷ್ಯ · 1972","yt":"-Oryie1c-gs","st":50}]}],"note":"Kannada resists a single word for pride: ಹೆಮ್ಮೆ is warm pride in someone, ಅಭಿಮಾನ is pride-as-loyalty, ಅಹಂಕಾರ is the pride that has gone bad. English collapses all three.","songs":[{"t":"ಹುಟ್ಟಿದರೆ ಕನ್ನಡ ನಾಡಲ್ಲಿ ಹುಟ್ಟಬೇಕು","by":"ಹಂಸಲೇಖ · ರಾಜಕುಮಾರ್","src":"ಆಕಸ್ಮಿಕ · 1993","yt":"dSqQkqqq8fM","st":47}],"also":[{"kn":"ಅಭಿಮಾನ","tr":"abhimāna","en":"pride as loyalty"},{"kn":"ಗರ್ವ","tr":"garva","en":"pride, tipping toward vanity"},{"kn":"ಅಹಂಕಾರ","tr":"ahaṅkāra","en":"the pride that has gone bad"},{"kn":"ಗತ್ತು","tr":"gattu","en":"swagger"}]},{"kn":"ಒಪ್ಪಿಗೆ","tr":"oppige","en":"Accepted","kids":[{"kn":"ಗೌರವ","tr":"gaurava","en":"Respected","kids":[],"note":"Something you give, actively, rather than something you passively have.","songs":[{"t":"ಎಲ್ಲಾದರೂ ಇರು ಎಂತಾದರೂ ಇರು","by":"ಕುವೆಂಪು · ಸಿ. ಅಶ್ವತ್ಥ್","src":"ಭಾವಗೀತೆ","yt":"fXPnnroHEOE","st":30}]},{"kn":"ಮನ್ನಣೆ","tr":"mannaṇe","en":"Valued","kids":[],"note":"ಮೌಲ್ಯ is price. ಮನ್ನಣೆ is being recognised and given your due: the thing people leave jobs for the lack of.","songs":[{"t":"ನಿನ್ನಿಂದಲೇ ನಿನ್ನಿಂದಲೇ","by":"","src":"ಮಿಲನ","yt":"-xmRjO2G05c","st":28}]}],"note":"Kannada has no noun for the felt state of being accepted. You say it as something others did: ನನ್ನನ್ನು ಒಪ್ಪಿಕೊಂಡರು, they took me in. The feeling lives in a verb.","songs":[{"t":"ಜೊತೆಯಲಿ ಜೊತೆ ಜೊತೆಯಲಿ","by":"ಇಳಯರಾಜ · ಎಸ್.ಪಿ.ಬಿ","src":"ಗೀತಾ · 1981","yt":"8HbwsAOfoRY","st":36}]},{"kn":"ಶಕ್ತಿ","tr":"śakti","en":"Powerful","kids":[{"kn":"ಧೈರ್ಯ","tr":"dhairya","en":"Courageous","kids":[],"note":"Steadiness under fear. The native alternatives are more physical: ಕೆಚ್ಚು is heat in the chest, ಎದೆಗಾರಿಕೆ is literally chest-having.","songs":[{"t":"ಕನ್ನಡ ನಾಡಿನ ವೀರ ರಮಣಿಯ","by":"","src":"ನಾಗರಹಾವು","yt":"ziNXOdlPLLE","st":28}],"also":[{"kn":"ಕೆಚ್ಚು","tr":"keccu","en":"embers-courage"},{"kn":"ಎದೆಗಾರಿಕೆ","tr":"edegārike","en":"nerve"},{"kn":"ದಿಟ್ಟತನ","tr":"diṭṭatana","en":"boldness"},{"kn":"ಛಲ","tr":"chala","en":"resolve"}]},{"kn":"ಹೊಳಹು","tr":"hoḷahu","en":"Creative","kids":[],"note":"The flash: the moment a thing occurs to you. Names the event rather than the faculty.","songs":[{"t":"ಕವಿತೆ ಕವಿತೆ","by":"ವಿ. ಹರಿಕೃಷ್ಣ · ವಿಜಯ್ ಪ್ರಕಾಶ್","src":"ಗಾಳಿಪಟ · 2008","yt":"nlv7XEpVzbM","st":50}],"also":[{"kn":"ಸೃಜನಶೀಲತೆ","tr":"sṛjanaśīlate","en":"creativity"},{"kn":"ಕಲ್ಪನೆ","tr":"kalpane","en":"imagining"},{"kn":"ಸ್ಫೂರ್ತಿ","tr":"sphūrti","en":"inspiration"}]}],"songs":[{"t":"ಆಕಾಶವೇ ಬೀಳಲಿ ಮೇಲೆ","by":"","src":"ನ್ಯಾಯವೇ ದೇವರು","yt":"9dtaiMx6Rl4","st":32}]},{"kn":"ನೆಮ್ಮದಿ","tr":"nemmadi","en":"Peaceful","kids":[{"kn":"ಪ್ರೀತಿ","tr":"prīti","en":"Loving","kids":[],"note":"The general word, used for parents, friends and lovers without embarrassment. ಮಮತೆ, ವಾತ್ಸಲ್ಯ, ಅಕ್ಕರೆ and ಒಲವು each take a different share of it.","songs":[{"t":"ನೂರೊಂದು ಜನ್ಮಕು","by":"","src":"ಅಮೆರಿಕಾ ಅಮೆರಿಕಾ","yt":"pFt58gtRgiM","st":28}],"also":[{"kn":"ಮಮತೆ","tr":"mamate","en":"attachment-love"},{"kn":"ವಾತ್ಸಲ್ಯ","tr":"vātsalya","en":"tenderness flowing downward"},{"kn":"ಅಕ್ಕರೆ","tr":"akkare","en":"fondness"},{"kn":"ಒಲವು","tr":"olavu","en":"leaning toward"}]},{"kn":"ಕೃತಜ್ಞತೆ","tr":"kṛtajñate","en":"Thankful","kids":[],"note":"Literally 'knowing what was done'. Gratitude as accurate memory.","songs":[{"t":"ಕೆರೆಯ ನೀರನು ಕೆರೆಗೆ ಚೆಲ್ಲಿ","by":"","src":"ಪುರಂದರದಾಸರ ಪದ","yt":"dcuOrNM45Uw","st":28}]}],"note":"The single most important correction on this wheel. ಶಾಂತಿ is peace as the absence of war: treaties, ceasefires, ಶಾಂತಿ ಸಭೆ. ನೆಮ್ಮದಿ is peace of mind, and it is what people actually pray for.","songs":[{"t":"ತಂಬೂರಿ ಮೀಟಿದವ","by":"ಕುಲದೀಪ್ ಎಂ. ಪೈ","src":"ಪುರಂದರದಾಸ","yt":"uCCaFqRoihQ","st":30}],"also":[{"kn":"ಶಾಂತಿ","tr":"śānti","en":"peace, as the absence of conflict"},{"kn":"ಸಮಾಧಾನ","tr":"samādhāna","en":"being consoled"},{"kn":"ನಿರಾಳ","tr":"nirāḷa","en":"unclenched"}]},{"kn":"ನಂಬಿಕೆ","tr":"nambike","en":"Trusting","kids":[{"kn":"ಸೂಕ್ಷ್ಮ","tr":"sūkṣma","en":"Sensitive","kids":[],"note":"ಸೂಕ್ಷ್ಮ means fine-grained, subtle-perceiving. Calling someone ಸೂಕ್ಷ್ಮ is praise: unlike English 'sensitive', which is half an accusation.","songs":[{"t":"ನಿನ್ನ ಕಂಗಳ ಕೊಳದಿ","by":"","src":"ಭಾವಗೀತೆ","yt":"ZOEJFLZsQmE","st":28}]},{"kn":"ಸಲಿಗೆ","tr":"salige","en":"Intimate","kids":[],"note":"ಸಲಿಗೆ has no English word. It is the earned licence to be informal with someone: to tease them, take their food, drop the honorific. Intimacy defined as permission, not as feeling.","songs":[{"t":"ಕಿವಿ ಮಾತೊಂದು ಹೇಳಲೇನು","by":"","src":"ಮಿಲನ","yt":"Ei_syfExf6Q","st":28}],"also":[{"kn":"ಆತ್ಮೀಯತೆ","tr":"ātmīyate","en":"closeness"},{"kn":"ಅನ್ಯೋನ್ಯ","tr":"anyōnya","en":"mutual, easy with each other"},{"kn":"ನಿಕಟ","tr":"nikaṭa","en":"near"}]}],"note":"ನಂಬಿಕೆ also means belief, and superstition. Trusting a person and believing a thing are one act.","songs":[{"t":"ನಂಬಿದೆ ನಿನ್ನ ನಾದದೇವತೆಯೇ","by":"","src":"ಸಂಧ್ಯಾರಾಗ","yt":"1XIdzVRWveI","st":32}]},{"kn":"ಭರವಸೆ","tr":"bharavase","en":"Optimistic","kids":[{"kn":"ಆಸೆ","tr":"āse","en":"Hopeful","kids":[],"note":"The plainest possible word: wish, want, hope, all one. Kannada does not separate hoping from wanting.","songs":[{"t":"ಒಂದೇ ಒಂದು ಆಸೆಯು","by":"","src":"ಚಿತ್ರಗೀತೆ","yt":"gXE3KK0mOeI","st":28}],"also":[{"kn":"ಆಶೆ","tr":"āśe","en":"hope, the Sanskrit form"},{"kn":"ಹಂಬಲ","tr":"hambala","en":"yearning"},{"kn":"ಬಯಕೆ","tr":"bayake","en":"wish"}]},{"kn":"ಸ್ಫೂರ್ತಿ","tr":"sphūrti","en":"Inspired","kids":[],"note":"No result. ಸ್ಫೂರ್ತಿ is the everyday word: a sudden welling-up, the same root as a spark.","songs":[{"t":"ಬಾರಿಸು ಕನ್ನಡ ಡಿಂಡಿಮವ","by":"ಶಿವಮೊಗ್ಗ ಸುಬ್ಬಣ್ಣ","src":"ಕುವೆಂಪು","yt":"48T3gr4AFJo","st":15}]}],"note":"ಭರವಸೆ is also the word for a promise or an assurance. Optimism, in Kannada, is something somebody gave you.","songs":[{"t":"ಅರಳುತಿರು ಜೀವದ ಗೆಳೆಯ","by":"","src":"ಮುಂಗಾರು ಮಳೆ","yt":"qzuKFxE672I","st":32}],"also":[{"kn":"ಆಶಾವಾದ","tr":"āśāvāda","en":"optimism, as a stance"},{"kn":"ನಿರೀಕ್ಷೆ","tr":"nirīkṣe","en":"expectation"},{"kn":"ನಂಬಿಕೆ","tr":"nambike","en":"trust, belief"}]}],"note":"Kannada keeps luck and gladness in separate words, where English <i>happy</i> still carries its old root <i>hap</i>, chance.","songs":[{"t":"ಸಂತೋಷಕ್ಕೆ ಹಾಡು ಸಂತೋಷಕ್ಕೆ","by":"","src":"ಗೀತಾ","yt":"neLfupVwObI","st":39}],"also":[{"kn":"ಖುಷಿ","tr":"khuṣi","en":"gladness, the most casual"},{"kn":"ಹರ್ಷ","tr":"harṣa","en":"joy, elevated"},{"kn":"ಆನಂದ","tr":"ānanda","en":"bliss"},{"kn":"ಸಂತಸ","tr":"santasa","en":"gladness, softer"},{"kn":"ಹಿಗ್ಗು","tr":"higgu","en":"swelling delight"}]},{"kn":"ಅಚ್ಚರಿ","tr":"accari","en":"Surprised","kids":[{"kn":"ಬೆಚ್ಚು","tr":" ressed","kids":[{"kn":"ಹೈರಾಣ","tr":"hairāṇa","en":"Overwhelmed","kids":[],"note":"English uses one <i>overwhelmed</i> in two places on this wheel. Kannada splits them by how you are swamped: ಹೈರಾಣ is worn down to nothing by too much work; ಕಳವಳ, over in ಭಯ, is being swamped by dread.","songs":[{"t":"ಇದೊಳ್ಳೆ ರಾಮಾಯಣ","by":"ಇಳಯರಾಜ","src":"ಇದೊಳ್ಳೆ ರಾಮಾಯಣ · 2016","yt":"6Osq8CFCPkY","st":120}]},{"kn":"ಚಡಪಡಿಕೆ","tr":"caḍapaḍike","en":"Restless","kids":[],"note":"Onomatopoeic: the sound of a fish on dry ground, or a body that cannot stay in the chair.","songs":[{"t":"ಮಳೆ ನಿಂತು ಹೋದ ಮೇಲೆ","by":"","src":"ಮಿಲನ","yt":"P5-vLnColQc","st":28}]}],"note":"The churn: the word for boiling liquid and for a mind that will not settle.","songs":[{"t":"ಈ ಸಂಜೆ ಯಾಕಾಗಿದೆ","by":"ಮನೋಮೂರ್ತಿ · ಸೋನು ನಿಗಮ್","src":"ಗೆಳೆಯ · 2007","yt":"-1TEJkzEgYc","st":40}]},{"kn":"ದಣಿವು","tr":"daṇivu","en":"Tired","kids":[{"kn":"ತೂಕಡಿಕೆ","tr":"tūkaḍike","en":"Sleepy","kids":[],"note":"The nod of the head as you lose the fight.","also":[{"kn":"ಜೋಂಪು","tr":"jōmpu","en":"the afternoon drowse"},{"kn":"ಮಂಪರು","tr":"mamparu","en":"half-sleep"},{"kn":"ನಿದ್ದೆ","tr":"nidde","en":"sleep"}],"songs":[{"t":"ಬದುಕು ಜಟಕಾ ಬಂಡಿ","by":"ಡಿ.ವಿ.ಜಿ · ಮೈಸೂರು ಅನಂತಸ್ವಾಮಿ","src":"ಮಂಕುತಿಮ್ಮನ ಕಗ್ಗ","yt":"jE8JvByDKy8","st":20,"from":"ದಣಿವು"}]},{"kn":"ಅನ್ಯಮನಸ್ಕ","tr":"anya-manaska","en":"Unfocused","kids":[],"note":"'Other-minded': your mind is somewhere, just not here. Kinder than 'distracted', which implies something pulled you.","songs":[{"t":"ಮುಂಜಾನೆ ಮಂಜಲ್ಲಿ","by":"","src":"ಜಸ್ಟ್ ಮಾತ್ ಮಾತಲ್ಲಿ","yt":"xNR4FAEGxV4","st":28}]}],"note":"Used of a body and of a day alike.","songs":[{"t":"ಬದುಕು ಜಟಕಾ ಬಂಡಿ","by":"ಡಿ.ವಿ.ಜಿ · ಮೈಸೂರು ಅನಂತಸ್ವಾಮಿ","src":"ಮಂಕುತಿಮ್ಮನ ಕಗ್ಗ","yt":"jE8JvByDKy8","st":20}],"also":[{"kn":"ಆಯಾಸ","tr":"āyāsa","en":"fatigue"},{"kn":"ಬಳಲಿಕೆ","tr":"baḷalike","en":"exhaustion"},{"kn":"ಸುಸ್ತು","tr":"sustu","en":"done in"}]}],"note":"The hardest sector. Kannada's ಕೆಟ್ಟ is moral or qualitative, a bad man, spoiled milk, and cannot be a feeling. But look at what the English wheel actually files under 'Bad': bored, busy, stressed, tired. That whole zone has one Kannada name, ಬೇಸರ: a fused weariness-with-things that English needs four words to circle.","songs":[{"t":"ಆಡಿಸಿದಾತ ಬೇಸರ ಮೂಡಿ","by":"","src":"ಕಸ್ತೂರಿ ನಿವಾಸ","yt":"nszeqsxnK_g","st":42}],"also":[{"kn":"ಬೇಜಾರು","tr":"bējāru","en":"fed up, the same word one register down"},{"kn":"ಸಪ್ಪೆ","tr":"sappe","en":"flat, unsalted"},{"kn":"ಜಡ","tr":"jaḍa","en":"inert"}]},{"kn":"ಭಯ","tr":"bhaya","en":"Fearful","kids":[{"kn":"ಹೆದರಿಕೆ","tr":"hedarike","en":"Scared","kids":[{"kn":"ಅಸಹಾಯಕತೆ","tr":"asahāyakate","en":"Helpless","kids":[],"note":"Helplessness as having nowhere to turn: ದಿಕ್ಕಿಲ್ಲದ, without a direction, says it best.","songs":[{"t":"ನೀರ ಬಿಟ್ಟು ನೆಲದ ಮೇಲೆ","by":"","src":"ಹೊಂಬಿಸಿಲು","yt":"1UKpmhCzNKE","st":28}]},{"kn":"ಅಂಜಿಕೆ","tr":"añjike","en":"Frightened","kids":[],"songs":[{"t":"ರಕ್ಷಕ ರಕ್ಷಕ","by":"ಗುರುಕಿರಣ್","src":"ಆಪ್ತರಕ್ಷಕ · 2010","yt":"2rTHfDcic14","st":25,"from":"ಹೆದರಿಕೆ"}]}],"songs":[{"t":"ರಕ್ಷಕ ರಕ್ಷಕ","by":"ಗುರುಕಿರಣ್","src":"ಆಪ್ತರಕ್ಷಕ · 2010","yt":"2rTHfDcic14","st":25}]},{"kn":"ಆತಂಕ","tr":"ātaṅka","en":"Anxious","kids":[{"kn":"ಚಿಂತೆ","tr":"cinte","en":"Worried","kids":[],"note":"ಚಿಂತೆ is also simply 'thought'. To worry and to think are the same verb, which tells you something.","songs":[{"t":"ಚಿಂತೆ ಯಾಕೆ ಮಾಡುತಿದ್ದೀ","by":"","src":"ದಾಸರ ಪದ","yt":"4a3hpsPdJsQ","st":28}],"also":[{"kn":"ಯೋಚನೆ","tr":"yōcane","en":"thinking it over"},{"kn":"ಕಾಳಜಿ","tr":"kāḷaji","en":"care, concern"},{"kn":"ತಲೆಬಿಸಿ","tr":"talebisi","en":"head-heat"}]},{"kn":"ಕಳವಳ","tr":"kaḷavaḷa","en":"Overwhelmed","kids":[],"note":"The second of the split: see ಹೈರಾಣ under ಬೇಸರ. ಕಳವಳ is being flooded by apprehension rather than by workload.","songs":[{"t":"ರಾ ರಾ ಸರಸಕು","by":"ಗುರುಕಿರಣ್ · ರಾಜೇಶ್ ನಂದಿತಾ","src":"ಆಪ್ತಮಿತ್ರ · 2004","yt":"ReeQgwpRO88","st":47,"from":"ಭಯ"}]}],"note":"ಆತಂಕ is now the standard clinical word too. Its older sense is closer to 'impediment': anxiety as the thing in your way.","also":[{"kn":"ಕಳವಳ","tr":"kaḷavaḷa","en":"agitation"},{"kn":"ಚಿಂತೆ","tr":"cinte","en":"worry, thought"},{"kn":"ತಳಮಳ","tr":"taḷamaḷa","en":"churn"},{"kn":"ವ್ಯಾಕುಲ","tr":"vyākula","en":"distress"}],"songs":[{"t":"ರಾ ರಾ ಸರಸಕು","by":"ಗುರುಕಿರಣ್ · ರಾಜೇಶ್ ನಂದಿತಾ","src":"ಆಪ್ತಮಿತ್ರ · 2004","yt":"ReeQgwpRO88","st":47,"from":"ಭಯ"}]},{"kn":"ಅಳುಕು","tr":"aḷuku","en":"Insecure","kids":[{"kn":"ಕೊರತೆ","tr":"korate","en":"Inadequate","kids":[],"note":"ಕೊರತೆ is a shortfall: of rain, of funds, of oneself. The same word, which quietly makes it feel less like a personal verdict.","songs":[{"t":"ಯಾರಿಗೆ ಯಾರಂಟು","by":"","src":"ಗಾಳಿ ಗೋಪುರ","yt":"bTE4wLWROYU","st":28}]},{"kn":"ಕೀಳರಿಮೆ","tr":"kīḷarime","en":"Inferior","kids":[],"note":"'Low-self-knowing': the exact and rather beautiful Kannada for an inferiority complex.","songs":[{"t":"ರಾ ರಾ ಸರಸಕು","by":"ಗುರುಕಿರಣ್ · ರಾಜೇಶ್ ನಂದಿತಾ","src":"ಆಪ್ತಮಿತ್ರ · 2004","yt":"ReeQgwpRO88","st":47,"from":"ಭಯ"}]}],"note":"The small inward flinch before you do the thing anyway. ಅಭದ್ರತೆ carries the other sense of <i>insecure</i>: physically unguarded, a word for buildings and borders.","also":[{"kn":"ಅಭದ್ರತೆ","tr":"abhadrate","en":"insecurity, of a thing unguarded"},{"kn":"ಹಿಂಜರಿಕೆ","tr":"hiñjarike","en":"hesitation"},{"kn":"ಶಂಕೆ","tr":"śaṅke","en":"misgiving with fear in it"}],"songs":[{"t":"ರಾ ರಾ ಸರಸಕು","by":"ಗುರುಕಿರಣ್ · ರಾಜೇಶ್ ನಂದಿತಾ","src":"ಆಪ್ತಮಿತ್ರ · 2004","yt":"ReeQgwpRO88","st":47,"from":"ಭಯ"}]},{"kn":"ದುರ್ಬಲ","tr":"durbala","en":"Weak","kids":[{"kn":"ದಂಡ","tr":"daṇḍa","en":"Worthless","kids":[],"note":"Literally waste. 'ನಾನು ದಂಡ' is how the feeling gets said about oneself.","songs":[{"t":"ಆಡಿಸಿ ನೋಡು ಬೀಳಿಸಿ ನೋಡು","by":"ಜಿ.ಕೆ. ವೆಂಕಟೇಶ್ · ಪಿ.ಬಿ.ಎಸ್","src":"ಕಸ್ತೂರಿ ನಿವಾಸ · 1971","yt":"jSrDSslk1g8","st":25}],"also":[{"kn":"ನಿಷ್ಪ್ರಯೋಜಕ","tr":"niṣprayōjaka","en":"of no use"},{"kn":"ಅಯೋಗ್ಯ","tr":"ayōgya","en":"unworthy"},{"kn":"ವ್ಯರ್ಥ","tr":"vyartha","en":"in vain"}]},{"kn":"ಲೆಕ್ಕಕ್ಕಿಲ್ಲ","tr":"lekkakkilla","en":"Insignificant","kids":[],"note":"'Not in the count.' Insignificance as an accounting error.","also":[{"kn":"ಕ್ಷುಲ್ಲಕ","tr":"kṣullaka","en":"trivial"},{"kn":"ಅಲ್ಪ","tr":"alpa","en":"slight"},{"kn":"ನಿಕೃಷ್ಟ","tr":"nikṛṣṭa","en":"abject"}],"songs":[{"t":"ರಾ ರಾ ಸರಸಕು","by":"ಗುರುಕಿರಣ್ · ರಾಜೇಶ್ ನಂದಿತಾ","src":"ಆಪ್ತಮಿತ್ರ · 2004","yt":"ReeQgwpRO88","st":47,"from":"ಭಯ"}]}],"songs":[{"t":"ರಾ ರಾ ಸರಸಕು","by":"ಗುರುಕಿರಣ್ · ರಾಜೇಶ್ ನಂದಿತಾ","src":"ಆಪ್ತಮಿತ್ರ · 2004","yt":"ReeQgwpRO88","st":47,"from":"ಭಯ"}]},{"kn":"ತಿರಸ್ಕಾರ","tr":"tiraskāra","en":"Rejected","kids":[{"kn":"ಹೊರಗಿಡು","tr":"horagiḍu","en":"Excluded","kids":[],"note":"Kannada says it as something done to you: ಹೊರಗಿಟ್ಟರು, they kept me out. ಬಹಿಷ್ಕಾರ is the same act with a history attached to it.","also":[{"kn":"ಬಹಿಷ್ಕಾರ","tr":"bahiṣkāra","en":"boycott, outcasting"},{"kn":"ದೂರವಿಡು","tr":"dūraviḍu","en":"to keep at a distance"},{"kn":"ಪ್ರತ್ಯೇಕಿಸು","tr":"pratyēkisu","en":"to separate off"}],"songs":[{"t":"ಅನಾಥ ಮಗುವಾದೆ","by":"ಶಂಕರ್ ನಾಗ್ · ಕೆ.ಜೆ. ಯೇಸುದಾಸ್","src":"ಹೊಸ ಜೀವನ · 1982","yt":"E1wCzRatR5o","st":30,"from":"ತಿರಸ್ಕಾರ"}]},{"kn":"ಕಿರುಕುಳ","tr":"kirukuḷa","en":"Persecuted","kids":[],"songs":[{"t":"ಯಾರಿಗೆ ಬಂತು ಎಲ್ಲಿಗೆ ಬಂತು ನಲವತ್ತೇಳರ ಸ್ವಾತಂತ್ರ್ಯ","by":"ಪಿಚ್ಚಳ್ಳಿ ಶ್ರೀನಿವಾಸ್","src":"ಸಿದ್ದಲಿಂಗಯ್ಯ","yt":"s90VmReOoco","st":46}]}],"note":"ತಿರಸ್ಕಾರ is what the other person did. As with ಒಪ್ಪಿಗೆ, Kannada gives you no noun for the receiving end: rejection is only ever described from outside.","songs":[{"t":"ಅನಾಥ ಮಗುವಾದೆ","by":"ಶಂಕರ್ ನಾಗ್ · ಕೆ.ಜೆ. ಯೇಸುದಾಸ್","src":"ಹೊಸ ಜೀವನ · 1982","yt":"E1wCzRatR5o","st":30}]},{"kn":"ಬೆದರಿಕೆ","tr":"bedarike","en":"Threatened","kids":[{"kn":"ನಡುಕ","tr":"naḍuka","en":"Nervous","kids":[],"note":"The tremble itself: Kannada names the body and lets the feeling be inferred.","songs":[{"t":"ಗರನೆ ಗರ ಗರನೆ","by":"ಗುರುಕಿರಣ್","src":"ಆಪ್ತರಕ್ಷಕ · 2010","yt":"QuUFeWG9qZQ","st":25,"from":"ಬೆದರಿಕೆ"}]},{"kn":"ಬಟಾಬಯಲು","tr":"baṭā-bayalu","en":"Exposed","kids":[],"note":"ಬಟಾಬಯಲು is open ground with not one thing to hide behind: used for landscape and for people, with no change of tone.","songs":[{"t":"ಗರನೆ ಗರ ಗರನೆ","by":"ಗುರುಕಿರಣ್","src":"ಆಪ್ತರಕ್ಷಕ · 2010","yt":"QuUFeWG9qZQ","st":25,"from":"ಬೆದರಿಕೆ"}]}],"note":"No entry for the adjective. ಬೆದರಿಕೆ is the threat itself; feeling threatened is said as ಬೆದರಿಕೆ ಇದೆ, 'there is a threat', placing it outside you rather than inside.","songs":[{"t":"ಗರನೆ ಗರ ಗರನೆ","by":"ಗುರುಕಿರಣ್","src":"ಆಪ್ತರಕ್ಷಕ · 2010","yt":"QuUFeWG9qZQ","st":25}],"also":[{"kn":"ಹೆದರಿಕೆ","tr":"hedarike","en":"being scared"},{"kn":"ಬೆಚ್ಚು","tr":"beccu","en":"a startle"},{"kn":"ಅಪಾಯ","tr":"apāya","en":"danger"}]}],"note":"Kannada grades fear finely: ಅಂಜಿಕೆ timid, ಹೆದರಿಕೆ scared, ದಿಗಿಲು dread, ಗಾಬರಿ panic, ಆತಂಕ anxiety, ಭೀತಿ terror.","songs":[{"t":"ರಾ ರಾ ಸರಸಕು","by":"ಗುರುಕಿರಣ್ · ರಾಜೇಶ್ ನಂದಿತಾ","src":"ಆಪ್ತಮಿತ್ರ · 2004","yt":"ReeQgwpRO88","st":47}],"also":[{"kn":"ಹೆದರಿಕೆ","tr":"hedarike","en":"being scared"},{"kn":"ಅಂಜಿಕೆ","tr":"añjike","en":"timidity"},{"kn":"ಭೀತಿ","tr":"bhīti","en":"terror"},{"kn":"ದಿಗಿಲು","tr":"digilu","en":"dread"},{"kn":"ಗಾಬರಿ","tr":"gābari","en":"panic"},{"kn":"ಆತಂಕ","tr":"ātaṅka","en":"anxiety"}]},{"kn":"ಕೋಪ","tr":"kōpa","en":"Angry","kids":[{"kn":"ಕೈಕೊಟ್ಟರು","tr":"kai-koṭṭaru","en":"Let down","kids":[{"kn":"ದ್ರೋಹ","tr":"drōha","en":"Betrayed","kids":[],"note":"ದ್ರೋಹ is grave: the word used for treason and for betraying a guru. Kannada does not have a casual register for this.","songs":[{"t":"ಮರೆಯದೆ ಕ್ಷಮಿಸು","by":"","src":"ಕನ್ನಡ ಚಿತ್ರಗೀತೆ","yt":"rPds_vgFFIw","st":32,"from":"ಕೈಕೊಟ್ಟರು"}]},{"kn":"ಅಸಮಾಧಾನ","tr":"asamādhāna","en":"Resentful","kids":[],"note":"Literally 'un-settledness': the negation of ಸಮಾಧಾನ, consolation. Resentment as a grievance that was never talked down.","songs":[{"t":"ಮರೆಯದೆ ಕ್ಷಮಿಸು","by":"","src":"ಕನ್ನಡ ಚಿತ್ರಗೀತೆ","yt":"rPds_vgFFIw","st":32,"from":"ಕೈಕೊಟ್ಟರು"}]}],"note":"Kannada has no noun here. You say ಕೈಕೊಟ್ಟರು, they gave me the hand, meaning they withdrew it at the moment you leaned on it.","songs":[{"t":"ಮರೆಯದೆ ಕ್ಷಮಿಸು","by":"","src":"ಕನ್ನಡ ಚಿತ್ರಗೀತೆ","yt":"rPds_vgFFIw", d shame: a bride's ನಾಚಿಕೆ and a thief's are the same noun. English needs three words and grades them differently; Kannada trusts context completely.","also":[{"kn":"ಸಂಕೋಚ","tr":"saṅkōca","en":"shrinking, reticence"},{"kn":"ಮುಜುಗರ","tr":"mujugara","en":"awkwardness"},{"kn":"ಲಜ್ಜೆ","tr":"lajje","en":"modesty, shame"}],"songs":[{"t":"ತಪ್ಪು ಮಾಡದವರು ಯಾರವ್ರೆ","by":"","src":"ಮಠ","yt":"WT44SioY3AU","st":32,"from":"ಪಾಪಪ್ರಜ್ಞೆ"}]},{"kn":"ಪಶ್ಚಾತ್ತಾಪ","tr":"paścāttāpa","en":"Remorseful","kids":[],"note":"'After-heat': the burn that arrives once the act is over.","songs":[{"t":"ಎಂದೆಂದೂ ನಿನ್ನನು ಮರೆತು ಬದುಕಿರಲಾರೆ","by":"ರಾಜನ್-ನಾಗೇಂದ್ರ · ಪಿ.ಬಿ.ಎಸ್","src":"ಎರಡು ಕನಸು · 1974","yt":"oB01cnveBIU","st":25}]}],"note":"Sin-consciousness. Kannada's guilt is borrowed either from law or from the temple; it has no private word of its own.","songs":[{"t":"ತಪ್ಪು ಮಾಡದವರು ಯಾರವ್ರೆ","by":"","src":"ಮಠ","yt":"WT44SioY3AU","st":32}]},{"kn":"ಖಿನ್ನತೆ","tr":"khinnate","en":"Depressed","kids":[{"kn":"ಕುಗ್ಗು","tr":"kuggu","en":"Inferior","kids":[],"note":"The English wheel repeats <i>inferior</i> in two branches. Kannada usefully does not: under fear it is ಕೀಳರಿಮೆ, a belief about your rank; here under sadness it is simply shrinking.","songs":[{"t":"ಜೀವ್ನಾನೇ ಶ್ಯಾನೆ ಬೇಜಾರು","by":"ಸಿಂಹ ಹಾಕಿದ ಹೆಜ್ಜೆ","src":"ಸಿಂಹ ಹಾಕಿದ ಹೆಜ್ಜೆ","yt":"UXRlbjyYYdk","st":8,"from":"ಖಿನ್ನತೆ"}]},{"kn":"ಬರಿದು","tr":"baridu","en":"Empty","kids":[],"note":"ಪೊಳ್ಳು is the sharper cousin: hollow, like a grain with nothing inside it. Used of people who look intact.","songs":[{"t":"ಜೀವ್ನಾನೇ ಶ್ಯಾನೆ ಬೇಜಾರು","by":"ಸಿಂಹ ಹಾಕಿದ ಹೆಜ್ಜೆ","src":"ಸಿಂಹ ಹಾಕಿದ ಹೆಜ್ಜೆ","yt":"UXRlbjyYYdk","st":8,"from":"ಖಿನ್ನತೆ"}]}],"note":"The clinical word, and recent. Older Kannada said ಮನಸ್ಸು ಕುಗ್ಗಿದೆ: the mind has shrunk.","songs":[{"t":"ಜೀವ್ನಾನೇ ಶ್ಯಾನೆ ಬೇಜಾರು","by":"ಸಿಂಹ ಹಾಕಿದ ಹೆಜ್ಜೆ","src":"ಸಿಂಹ ಹಾಕಿದ ಹೆಜ್ಜೆ","yt":"UXRlbjyYYdk","st":8}]},{"kn":"ನೋವು","tr":"nōvu","en":"Hurt","kids":[{"kn":"ಆಶಾಭಂಗ","tr":"āśābhaṅga","en":"Disappointed","kids":[],"note":"The second 'disappointed' on the wheel. ನಿರಾಸೆ over in ಅಸಹ್ಯ is hope that faded; ಆಶಾಭಂಗ is hope that snapped.","songs":[{"t":"ನೀನಿರದೆ","by":"","src":"ಗೂಗ್ಲಿ","yt":"g5O5ufz8w34","st":32,"from":"ನೋವು"}]},{"kn":"ಸಂಕೋಚ","tr":"saṅkōca","en":"Embarrassed","kids":[],"note":"The other 'embarrassed'. ಮುಜುಗರ is the wince at a social scene; ಸಂಕೋಚ is the shrinking-in-on-yourself, the hesitation to ask, to take, to take up room.","songs":[{"t":"ನಾಚಿಕೆ ಇನ್ನೇಕೆ","by":"ರಾಜನ್-ನಾಗೇಂದ್ರ · ಎಸ್. ಪಿ. ಬಾಲಸುಬ್ರಹ್ಮಣ್ಯಂ · ಎಸ್. ಜಾನಕಿ","src":"ಕಿಲಾಡಿ ಜೋಡಿ · 1978","yt":"2025drFL5ks","st":20}]}],"note":"ನೋವು is bodily pain and emotional pain with no distinction at all. 'ಮನಸ್ಸಿಗೆ ನೋವಾಯಿತು', it hurt my mind, is the ordinary way to say you were wounded.","songs":[{"t":"ನೀನಿರದೆ","by":"","src":"ಗೂಗ್ಲಿ","yt":"g5O5ufz8w34","st":32}],"also":[{"kn":"ಬೇನೆ","tr":"bēne","en":"ache, ailment"},{"kn":"ಯಾತನೆ","tr":"yātane","en":"torment"},{"kn":"ಬಾಧೆ","tr":"bādhe","en":"affliction"}]}],"note":"ಅಶುಭ and ಅಮಂಗಳ, inauspicious, sit close to this word: for a large part of Kannada usage a sad event is an unlucky one.","songs":[{"t":"ನೀ ಹೀಂಗ ನೋಡಬ್ಯಾಡ ನನ್ನ","by":"ಸಿ. ಅಶ್ವತ್ಥ್","src":"ದ.ರಾ. ಬೇಂದ್ರೆ","yt":"L4f3c63uSkU","st":33}],"also":[{"kn":"ಶೋಕ","tr":"śōka","en":"formal mourning"},{"kn":"ವ್ಯಥೆ","tr":"vyathe","en":"affliction"},{"kn":"ಸಂಕಟ","tr":"saṅkaṭa","en":"the chest closing"},{"kn":"ಕೊರಗು","tr":"koragu","en":"the grief that thins you"},{"kn":"ವಿಷಾದ","tr":"viṣāda","en":"melancholy"},{"kn":"ಅಳಲು","tr":"aḷalu","en":"the wail"}]}]},{"id":"odalu","hint":"The centre is where in the body it happens, the middle ring is the feeling, and the outer ring is what gets said. Tap to zoom in; tap the middle to come back out.","blurb":"Not a translation of anything. Kannada mostly names a feeling by saying <em>where in the body it is happening</em>: ಹೊಟ್ಟೆಕಿಚ್ಚು, belly-fire; ಎದೆಗುಂದು, the chest sinks; ಕರುಳು ಚುರುಕ್, the gut stings. So the seven seats are the centre, the feelings you would actually name are the middle ring, and the phrases people say are the outer one.","aboutTitle":"ಒಡಲು","aboutLat":"the body as the vessel of feeling","about":"ಒಡಲು is an old word for the body considered as a container: the thing feeling happens inside. English builds compounds like this too (heartbroken, gutted, hot-headed) but treats them as figurative colour on top of a real vocabulary. In Kannada they <em>are</em> the vocabulary, and they are not heard as metaphor: ಹೊಟ್ಟೆ ತೊಳಸು covers moral revulsion and actual nausea with nothing between the two senses.","cards":[{"h":"Navigate by the feeling, not the organ","p":"The seat is the grouping, but the ring you actually read is the middle one, and it holds ordinary feeling-names: ಧೈರ್ಯ, ಹೆಮ್ಮೆ, ಚಿಂತೆ, ಮುನಿಸು, ನೆಮ್ಮದಿ. The body explains why those particular feelings sit together."},{"h":"Words with no English slot","p":"ಮುನಿಸು, the sulk you are only entitled to with someone who loves you. ಸಲಿಗೆ, the earned licence to be informal with a person. ಕರುಳ ಬಳ್ಳಿ, the gut-vine: your own child. ಎದೆ ಝಲ್, the single cold jolt of alarm."},{"h":"ಕರುಳು is the strange one","p":"In Kannada the gut is the organ of kinship, your child is your ಕರುಳ ಬಳ್ಳಿ, so every feeling sited there is about your own people. ಕರುಳು ಕಿತ್ತು ಬರು is kept for the death of a child or a parent, and using it lightly would be shocking."},{"h":"What it misses","p":"Feelings with no bodily seat fall off: ಅಭಿಮಾನ, ಹಂಬಲ, ಕೃತಜ್ಞತೆ, ಸಂಭ್ರಮ. Catching those needs a second axis: probably direction, since ವಾತ್ಸಲ್ಯ only ever flows downward, ಗೌರವ upward and ಸಲಿಗೆ sideways."}],"name":"ಒಡಲ ಚಕ್ರ","hubKn":"ಒಡಲು","hubRom":"oḍalu · the body as vessel","tag":"Seven seats of the body: not a translation of anything.","data":[{"kn":"ಎದೆ","tr":"ede","en":"chest","kids":[{"kn":"ಧೈರ್ಯ","tr":"dhairya","en":"courage","kids":[{"kn":"ಕೆಚ್ಚೆದೆ","tr":"keccede","en":"fierce courage","kids":[],"lit":"a chest of embers","note":"ಕೆಚ್ಚು is heat held in the body. The bravery word is thermal, not moral.","songs":[{"t":"ಕನ್ನಡ ನಾಡಿನ ವೀರ ರಮಣಿಯ","by":"","src":"ನಾಗರಹಾವು :"ಮುನಿಸು","tr":"munisu","en":"the loving sulk"},{"kn":"ಸೆಡವು","tr":"seḍavu","en":"a huff"}]},{"kn":"ನಾಚಿಕೆ","tr":"nāchike","en":"shyness and shame at once","kids":[{"kn":"ಕಣ್ಣು ತಗ್ಗಿಸು","tr":"kaṇṇu taggisu","en":"averting the eyes","kids":[],"lit":"to lower the eyes","note":"The gesture that covers modesty, shyness and guilt without distinguishing them.","songs":[{"t":"ನಿಲ್ಲು ನಿಲ್ಲೇ ಪತಂಗ","by":"","src":"ಎಡಕಲ್ಲು ಗುಡ್ಡದ ಮೇಲೆ","yt":"_Kr6ZDcBnO8","st":28}]},{"kn":"ಮುಜುಗರ","tr":"mujugara","en":"awkwardness","kids":[],"note":"The wince at a social scene, often on someone else's behalf.","songs":[{"t":"ಪ್ಯಾರ್ಗೆ ಆಗ್ಬಿಟ್ಟೈತೆ","by":"","src":"ಗೋವಿಂದಾಯ ನಮಃ","yt":"eccBCKBmJr0","st":28}],"also":[{"kn":"ಸಂಕೋಚ","tr":"saṅkōca","en":"shrinking"},{"kn":"ಇರುಸುಮುರುಸು","tr":"irusumurusu","en":"squirming discomfort"},{"kn":"ಕಸಿವಿಸಿ","tr":"kasivisi","en":"small unease"}]}],"note":"A bride's ನಾಚಿಕೆ and a thief's are the same noun. English needs three words and grades them differently; Kannada trusts context completely.","songs":[{"t":"ನಾಚಿಕೆ ಇನ್ನೇಕೆ","by":"ರಾಜನ್-ನಾಗೇಂದ್ರ · ಎಸ್. ಪಿ. ಬಾಲಸುಬ್ರಹ್ಮಣ್ಯಂ · ಎಸ್. ಜಾನಕಿ","src":"ಕಿಲಾಡಿ ಜೋಡಿ · 1978","yt":"2025drFL5ks","st":20}],"also":[{"kn":"ಸಂಕೋಚ","tr":"saṅkōca","en":"shrinking, reticence"},{"kn":"ಮುಜುಗರ","tr":"mujugara","en":"awkwardness"},{"kn":"ಲಜ್ಜೆ","tr":"lajje","en":"modesty, shame"}]}],"note":"The public instrument. These are the feelings other people read off you whether or not you meant them to: which is why the sulk lives here and not in ಕೋಪ.","songs":[{"t":"ನಗುವ ನಯನ ಮಧುರ ಮೌನ","by":"ಇಳಯರಾಜ · ಎಸ್.ಪಿ.ಬಿ","src":"ಪಲ್ಲವಿ ಅನುಪಲ್ಲವಿ · 1983","yt":"AJSeaFthdeE","st":34}]}]},{"id":"rasa","hint":"The nine rasas are the centre; underneath each one are the words Kannada uses for that flavour. Tap to zoom in; tap the middle to come back out.","blurb":"The oldest map of feeling this language has, opened out. The nine rasas are an aesthetic theory, what an audience can be made to feel, and a thousand years of Kannada poetry is organised by them. Here each rasa keeps its Sanskrit name, because that is what everyone calls it, and everything beneath it is the daily word: ಸಿಟ್ಟು under ರೌದ್ರ, ಬೆರಗು under ಅದ್ಭುತ, ಬೇಸರ under ಬೀಭತ್ಸ.","aboutTitle":"ನವರಸ","aboutLat":"nine flavours, not nine emotions","about":"A rasa is not an emotion. It is the flavour an audience tastes, which is why each has a ಸ್ಥಾಯಿಭಾವ, a durable underlying feeling, listed separately in the panel: ಶೃಂಗಾರ is the flavour, ರತಿ is the feeling. That distinction has no equivalent in any Western emotion wheel, and it is the reason this map can hold ವೀರ and ಹಾಸ್ಯ, which the other two cannot.","cards":[{"h":"Sanskrit at the centre, Kannada everywhere else","p":"The nine names are Sanskrit and stay Sanskrit: ಶೃಂಗಾರ, ಹಾಸ್ಯ, ಕರುಣ, ರೌದ್ರ, ವೀರ, ಭಯಾನಕ, ಬೀಭತ್ಸ, ಅದ್ಭುತ, ಶಾಂತ. Every Kannada speaker who has watched a dance recital knows them. Underneath, the words are ordinary: ರೊಚ್ಚು, ಗಾಬರಿ, ಹೊಟ್ಟೆ ತೊಳಸು, ಗತ್ತು, ದಂಗು, ಸೇಡು."},{"h":"The two the other wheels lose","p":"ವೀರ, the heroic, and ಶೃಂಗಾರ, the erotic. No English feeling wheel has a slot for either. ವೀರ's underlying feeling is not courage but ಉತ್ಸಾಹ, energy, which quietly claims heroism is a kind of enthusiasm."},{"h":"ಶಾಂತ, the one they argued about","p":"The ninth rasa was added late and disputed for centuries: can the absence of agitation be a flavour at all? The English wheel files peace under happiness. The rasa tradition insists it is a state of its own, and gives it ಶಮ, quiet: as its durable feeling."},{"h":"The colours are not decoration","p":"The Nāṭyaśāstra assigns each rasa a colour, and this wheel follows them: ಶೃಂಗಾರ śyāma green, ರೌದ್ರ red, ವೀರ wheaten gold, ಭಯಾನಕ black, ಬೀಭತ್ಸ blue, ಅದ್ಭುತ yellow, ಕರುಣ dove grey, ಹಾಸ್ಯ and ಶಾಂತ white: the last three shifted just far enough to stay legible on both a light and a dark ground."}],"name":"ರಸಚಕ್ರ","hubKn":"ನವರಸ","hubRom":"nava-rasa · the nine flavours","tag":"The nine rasas, each with its ಸ್ಥಾಯಿಭಾವ, opened out into daily Kannada.","data":[{"kn":"ಶೃಂಗಾರ","tr":"śṛṅgāra","en":"love, the erotic","kids":[{"kn":"ಒಲವು","tr":"olavu","en":"fondness, leaning-toward","kids":[{"kn":"ಪ್ರೀತಿ","tr":"prīti","en":"love","kids":[],"note":"The general word, used for parents, friends and lovers without embarrassment.","songs":[{"t":"ನೂರೊಂದು ಜನ್ಮಕು","by":"ರಮೇಶ್ ಕುರುಬಗಟ್ಟಿ","src":"ಅಮೆರಿಕಾ ಅಮೆರಿಕಾ","yt":"pFt58gtRgiM","st":28},{"t":"ಪ್ರೀತಿಯ ಪಾರಿವಾಳ","by":"ರಮೇಶ್ ಕುರುಬಗಟ್ಟಿ","src":"ಜನಪದ","yt":"UJG41Bl1huU","st":20}],"also":[{"kn":"ಮಮತೆ","tr":"mamate","en":"attachment-love"},{"kn":"ವಾತ್ಸಲ್ಯ","tr":"vātsalya","en":"tenderness flowing downward"},{"kn":"ಅಕ್ಕರೆ","tr":"akkare","en":"fondness"},{"kn":"ಒಲವು","tr":"olavu","en":"leaning toward"}]},{"kn":"ಅಕ್ಕರೆ","tr":"akkare","en":"affection","kids":[],"note":"ಮೆಚ್ಚುಗೆ is admiration, which is a judgement. ಒಲವು is a leaning, and ಅಕ್ಕರೆ is what a leaning feels like.","songs":[{"t":"ಒಲವಿನ ಉಡುಗೊರೆ ಕೊಡಲೇನು","by":"ಎಂ. ರಂಗರಾವ್","src":"ಒಲವಿನ ಉಡುಗೊರೆ · 1987","yt":"19r6J7zYjcA","st":20,"from":"ಒಲವು"},{"t":"ಬಡವನಾದರೇನು ಪ್ರಿಯೇ","by":"ಸಿ. ಅಶ್ವತ್ಥ್","src":"ಭಾವಗೀತೆ","yt":"nvJT6ymY8l4","st":30,"from":"ಒಲವು"},{"t":"ನೀ ನನ್ನ ಒಲವು","by":"ಸುನಿ","src":"ಚಮಕ್ · 2017","yt":"Sg8cO2lSDjw","st":30,"from":"ಒಲವು"}]}],"note":"Native, and the gentlest of the love words. You have ಒಲವು for a person, a place, or an idea.","songs":[{"t":"ಒಲವಿನ ಉಡುಗೊರೆ ಕೊಡಲೇನು","by":"ಎಂ. ರಂಗರಾವ್","src":"ಒಲವಿನ ಉಡುಗೊರೆ · 1987","yt":"19r6J7zYjcA","st":20},{"t":"ಬಡವನಾದರೇನು ಪ್ರಿಯೇ","by":"ಸಿ. ಅಶ್ವತ್ಥ್","src":"ಭಾವಗೀತೆ","yt":"nvJT6ymY8l4","st":30},{"t":"ನೀ ನನ್ನ ಒಲವು","by":"ಸುನಿ","src":"ಚಮಕ್ · 2017","yt":"Sg8cO2lSDjw","st":30}]},{"kn":"ಸರಸ","tr":"sarasa","en":"playful flirtation","kids":[{"kn":"ಚೆಲ್ಲಾಟ","tr":"cellāṭa","en":"dalliance","kids":[],"note":"Play with a loose edge to it: used affectionately and as a mild accusation.","songs":[{"t":"ನಿಲ್ಲು ನಿಲ್ಲೇ ಪತಂಗ","by":"","src":"ಎಡಕಲ್ಲು ಗುಡ್ಡದ ಮೇಲೆ","yt":"_Kr6ZDcBnO8","st":28}]},{"kn":"ನಾಚಿಕೆ","tr":"nāchike","en":"bashfulness","kids":[],"note":"Shyness, modesty and shame in one noun. A bride's ನಾಚಿಕೆ and a thief's are the same word.","songs":[{"t":"ಬಿಂಕದ ಸಿಂಗಾರಿ","by":"","src":"ಕನ್ಯಾರತ್ನ","yt":"URetKS2ebzQ","st":28}],"also":[{"kn":"ಸಂಕೋಚ","tr":"saṅkōca","en":"shrinking, reticence"},{"kn":"ಮುಜುಗರ","tr":"mujugara","en":"awkwardness"},{"kn":"ಲಜ್ಜೆ","tr":"lajje","en":"modesty, shame"}]}],"note":"Literally 'with rasa'. The word for banter between people who like each other, and it is not coy about it. ಸರಸ is the asking, not the having.","songs":[{"t":"ಚೆಲುವೆ ಒಂದು ಕೇಳ್ತೀನಿ","by":"ಹಂಸಲೇಖ","src":"ಪ್ರೇಮಲೋಕ · 1987","yt":"ntte23oU56A","st":30}]},{"kn":"ವಿರಹ","tr":"viraha","en":"the pain of separation","kids":[{"kn":"ಹಂಬಲ","tr":"hambala","en":"yearning","kids":[],"note":"The pull toward something absent: a place, a person, a life not lived.","songs":[{"t":"ಯಾವ ಜನುಮದ ಗೆಳತಿ","by":"ವಿ. ಹರಿಕೃಷ್ಣ","src":"ಆರಾಧನಾ · 2013","yt":"FwqTyzZJ7rY","st":40},{"t":"ವಿರಹ ನೂರು ನೂರು ತರಹ","by":"ವಿ. ಹರಿಕೃಷ್ಣ","src":"ಎಡಕಲ್ಲು ಗುಡ್ಡದ ಮೇಲೆ","yt":"AHqvd_nVJxE","st":28}],"also":[{"kn":"ಕಾತರ","tr":"kātara","en":"aching eagerness"},{"kn":"ತವಕ","tr":"tavaka","en":"eagerness"},{"kn":"ಹಪಹಪಿ","tr":"hapahapi","en":"craving"}]},{"kn":"ಕಾತರ","tr":"kātara","en":"aching eagerness","kids":[],"note":"Waiting that has begun to hurt slightly.","songs":[{"t":"ಎಲ್ಲಿರುವೆ ಮನವ ಕಾಡುವ ರೂಪಸಿಯೇ","by":"","src":"ಬಯಲು ದಾರಿ","yt":"Dkm1xvK7EUE","st":28}]}],"note":"A whole genre of Kannada poetry sits here. English has no single word, which is why so much of it gets translated as 'longing' and loses the ache. A poem before it was a film song; the separation is from a flute you cannot find.","songs":[{"t":"ಯಾವ ಮೋಹನ ಮುರಳಿ ಕರೆಯಿತು","by":"ಸಿ. ಅಶ್ವತ್ಥ್","src":"ಗೋಪಾಲಕೃಷ್ಣ ಅಡಿಗ · ಅಮೆರಿಕ ಅಮೆರಿಕ","yt":"iaNgco2oRUs","st":35}]},{"kn":"ಮೋಹ","tr":"mōha","en":"infatuation","kids":[{"kn":"ಸೆಳೆತ","tr":"seḷeta","en":"pull, attraction","kids":[],"note":"Native and physical: the same word for an undertow and for a muscle cramp.","songs":[{"t":"ಕನಸಲು ನೀನೇ ಮನಸಲು ನೀನೇ","by":"","src":"ಬಯಲು ದಾರಿ","yt":"7CS11BGmP98","st":28}]},{"kn":"ವ್ಯಾಮೋಹ","tr":"vyāmōha","en":"obsessive attachment","kids":[],"note":"ಮೋಹ with the brakes off. Said of parents about children as often as of lovers.","songs":[{"t":"ಉಸಿರೇ ಉಸಿರೇ","by":"","src":"ಹುಚ್ಚ","yt":"Ukk2pr5inBA","st":28}]}],"note":"In philosophy ಮೋಹ is delusion, one of the six enemies. In daily speech it is simply being besotted: the moral warning is still audible underneath.","songs":[{"t":"ಅನಿಸುತಿದೆ ಯಾಕೋ ಇಂದು","by":"ಮನೋಮೂರ್ತಿ · ಸೋನು ನಿಗಮ್","src":"ಮುಂಗಾರು ಮಳೆ · 2006","yt":"nlsLKA6hlVQ","st":35},{"t":"ಅರಳುತಿದೆ ಮೋಹ","by":"ರಾಜಕುಮಾರ","src":"ನಾನೊಬ್ಬ ಕಳ್ಳ · 1979","yt":"BCMoEcj7c10","st":25}]}],"sthayi":"ರತಿ · rati, desire","note":"The first and most argued-over rasa. It is not romance in the modern sense: ಶೃಂಗಾರ covers the whole apparatus of attraction, adornment and separation, and half of it is about being apart.","songs":[{"t":"ಜೊತೆಯಲಿ ಜೊತೆ ಜೊತೆಯಲಿ","by":"ಇಳಯರಾಜ · ಎಸ್.ಪಿ.ಬಿ","src":"ಗೀತಾ · 1981","yt":"8HbwsAOfoRY","st":36}]},{"kn":"ಹಾಸ್ಯ","tr":"hāsya","en":"mirth, the comic","kids":[{"kn":"ನಗು","tr":"nagu","en":"laughter","kids":[{"kn":"ಅಟ್ಟಹಾಸ","tr":"aṭṭahāsa","en":"the loud laugh","kids":[],"note":"ನಗೆ was ನಗು again with a different ending, which is a synonym rather than a kind. ಬೊಂಡ ನಾ ಬಜ್ಜಿ ನಾ is a food novelty. ಅಟ್ಟಹಾಸ is a laugh with a threat in it.","songs":[{"t":"ನಗು ನಗುತಾ ನಲಿ ನಲಿ","by":"ರಾಜನ್-ನಾಗೇಂದ್ರ · ಪಿ.ಬಿ.ಎಸ್","src":"ಬಂಗಾರದ ಮನುಷ್ಯ · 1972","yt":"uJRbb59gN0s","st":55,"from":"ನಗು"}]},{"kn":"ಕಿಸಿಕಿಸಿ","tr":"kisikisi","en":"giggling","kids":[],"note":"Sound-word. The laughter you are trying and failing to suppress.","songs":[{"t":"ಬೊಂಬೆ ಹೇಳುತೈತೆ","by":"ವಿ. ಹರಿಕೃಷ್ಣ","src":"ರಾಜಕುಮಾರ · 2017","yt":"fpGvB7AT1vA","st":45}]}],"note":"The plain native verb-noun. Everything else in this sector is a shade of it.","songs":[{"t":"ನಗು ನಗುತಾ ನಲಿ ನಲಿ","by":"ರಾಜನ್-ನಾಗೇಂದ್ರ · ಪಿ.ಬಿ.ಎಸ್","src":"ಬಂಗಾರದ ಮನುಷ್ಯ · 1972","yt":"uJRbb59gN0s","st":55}]},{"kn":"ತಮಾಷೆ","tr":"tamāṣe","en":"fun","kids":[{"kn":"ತುಂಟತನ","tr":"ṭuṇṭatana","en":"mischief","kids":[],"note":"The naughtiness of a child you are not actually angry with
