/* How the wheel gets read.

   Set ENDPOINT to the URL of the bhava-log worker and this starts counting.
   Leave it empty and nothing is sent, nothing is stored, and no id is minted:
   the file is inert until you fill in one line.

   What it records: which wheel was opened, which word was selected and which
   word the reader came from, how long they stayed there, and how much of a
   song actually played. The `from` is the interesting one, because a pile of
   view counts cannot tell you that people arrive at ವಿರಹ from ಪ್ರೀತಿ rather
   than from ಶೃಂಗಾರ, and that is the question.

   What it does not record: no cookies, no IP, no user agent, no referrer, no
   location, nothing typed. The id is a random uuid in localStorage that means
   nothing anywhere else, and a reader who has asked not to be tracked is not
   tracked: Do Not Track and Global Privacy Control are both honoured, and
   `localStorage['bhava.notrack'] = 1` opts out by hand.                     */
(function () {
  const ENDPOINT = "https://bhava-log.rala-search.workers.dev/e";

  const off = !ENDPOINT ||
    navigator.doNotTrack === "1" || window.doNotTrack === "1" ||
    navigator.globalPrivacyControl === true ||
    (() => { try { return localStorage.getItem("bhava.notrack") === "1"; } catch (e) { return true; } })();

  if (off) { window.Track = () => {}; return; }

  const id = () => (crypto.randomUUID ? crypto.randomUUID()
    : String(Math.random()).slice(2) + Date.now().toString(36));

  let aid;
  try {
    aid = localStorage.getItem("bhava.aid");
    if (!aid) { aid = id(); localStorage.setItem("bhava.aid", aid); }
  } catch (e) { aid = id(); }        // private window: a one-visit id is fine
  const sid = id();

  let queue = [], timer = null, first = true;

  function flush() {
    clearTimeout(timer); timer = null;
    if (!queue.length) return;
    // `first` asks the worker to count one visit against the city it sees.
    // That count lands in its own table with no id on the row, so it can
    // never be joined back to what this reader looked at.
    const body = JSON.stringify({ aid, sid, first, ev: queue.splice(0, 60) });
    first = false;
    // sendBeacon survives the page being closed, which is exactly when the
    // last and most interesting events are sitting in the queue
    // text/plain, not application/json, and it matters: application/json is
    // not a CORS-safelisted content type, so the browser would want a preflight
    // first, and sendBeacon cannot preflight. It returns true, queues nothing
    // that survives, and the events vanish without an error anywhere. The
    // worker reads the body as text and parses it itself, so the header is
    // decoration either way.
    const blob = new Blob([body], { type: "text/plain;charset=UTF-8" });
    try {
      if (!navigator.sendBeacon || !navigator.sendBeacon(ENDPOINT, blob))
        fetch(ENDPOINT, { method: "POST", body, keepalive: true,
                          headers: { "content-type": "text/plain;charset=UTF-8" } }).catch(() => {});
    } catch (e) {}
  }

  window.Track = function (t, d) {
    queue.push(Object.assign({ t }, d || {}));
    if (queue.length >= 40) return flush();
    if (!timer) timer = setTimeout(flush, 15000);
  };

  addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
  addEventListener("pagehide", flush);
})();

/* Sunburst renderer shared by all three wheels.

   Two rules learned the hard way:

   1. Never use <textPath> for Kannada. It positions each glyph separately along
      the arc, which shatters an akshara into base + vowel sign + ottakshara,
      each rotated on its own. The innermost visible ring is therefore upright
      and never rotated; the outer rings rotate the whole string as one unit.

   2. Do not zoom by scaling the group. A CSS transform needs overflow:visible
      to look right, and then the dimmed rest of the wheel paints over the page.
      Drilling in re-lays-out instead: the chosen sector's children are given
      the full 360 degrees and the radii are recomputed, so the drawing always
      fills exactly the same box and the middle is always the way back out.   */
(function () {
  const SVG = "http://www.w3.org/2000/svg";
  const CX = 400, CY = 400;
  const R_FULL = [96, 186, 262, 352];   // whole wheel: sector, branch, leaf
  const R_ZOOM = [140, 250, 352];       // one sector opened out: branch, leaf
  const FS_FULL = [21, 15, 12];
  const FS_ZOOM = [26, 17];
  // a ring keeps the colour it has on the whole wheel, so opening a sector does
  // not recolour it: mix by the word's real depth, never by where it is drawn
  const MIX = ["100%", "var(--mix-mid)", "var(--mix-leaf)"];
  const INK = ["var(--core-ink)", "var(--mid-ink)", "var(--leaf-ink)"];
  const EASE = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  const svg = document.getElementById("wheel");
  const detail = document.getElementById("detail");
  const backBtn = document.getElementById("zoomOut");

  let gRoot, hubDisc, hubText, nodes = [], wheel = null;
  let english = false, focus = null, held = null, anim = null, hot = null;
  let byName = new Map();          // kannada -> node, for restoring a shared link
  let lastSel = null, lastSelAt = 0;   // where the reader came from, and when
  let onChange = () => {};

  const el = (n, a) => {
    const e = document.createElementNS(SVG, n);
    for (const k in a) e.setAttribute(k, a[k]);
    return e;
  };
  const pol = (a, r) => {
    const t = (a - 90) * Math.PI / 180;
    return [CX + r * Math.cos(t), CY + r * Math.sin(t)];
  };
  function arc(a0, a1, r0, r1) {
    if (a1 - a0 < 0.01 || r1 - r0 < 0.01) return "M0 0";
    const big = (a1 - a0) > 180 ? 1 : 0;
    const [x0, y0] = pol(a0, r1), [x1, y1] = pol(a1, r1);
    const [x2, y2] = pol(a1, r0), [x3, y3] = pol(a0, r0);
    return `M${x0} ${y0}A${r1} ${r1} 0 ${big} 1 ${x1} ${y1}` +
           `L${x2} ${y2}A${r0} ${r0} 0 ${big} 0 ${x3} ${y3}Z`;
  }
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* ------------------------------------------------------------- build */
  function build(w) {
    wheel = w;
    svg.textContent = "";
    nodes = [];
    focus = null; held = null;

    gRoot = el("g", {});
    (function add(list, depth, parent, sector) {
      list.forEach((d, i) => {
        const n = { d, depth, parent, sector: depth === 0 ? i : sector, kids: [] };
        n.cur = { a0: 0, a1: 0, r0: R_FULL[0], r1: R_FULL[0], o: 0 };
        nodes.push(n);
        if (parent) parent.kids.push(n);
        if (d.kids && d.kids.length) add(d.kids, depth + 1, n, n.sector);
      });
    })(w.data, 0, null, 0);

    byName = new Map(nodes.map(n => [n.d.kn, n]));   // for restoring a shared link

    nodes.forEach(n => {
      const g = el("g", { class: "seg", tabindex: "0", role: "button" });
      n.path = el("path", {
        fill: `color-mix(in oklab, var(--${w.id}-${n.sector}) ${MIX[n.depth]}, var(--mixer))`,
        stroke: "var(--ground)", "stroke-width": 1.4, "vector-effect": "non-scaling-stroke" });
      n.text = el("text", { "text-anchor": "middle", "dominant-baseline": "central" });
      n.text.textContent = n.d.kn;
      g.appendChild(n.path); g.appendChild(n.text);
      g.setAttribute("aria-label", `${n.d.kn}, ${n.d.tr}, ${n.d.en}`);
      n.g = g;

      // mouse only: on a touchscreen pointerenter fires while the finger is
      // dragging the page and would swap the panel out mid-scroll
      g.addEventListener("pointerenter", e => {
        if (e.pointerType !== "mouse") return;
        setHot(n); if (!held) show(n);
      });
      g.addEventListener("pointerleave", e => {
        if (e.pointerType === "mouse" && hot === n) setHot(null);
      });
      g.addEventListener("focus", () => show(n));
      g.addEventListener("click", e => {
        e.stopPropagation();
        if (!focus) drill(n, true);   // open the sector first: drilling resets
        show(n); held = n;            // ...then keep the word that was tapped
        // the click is the gesture the browser wants, so the song starts here
        // and never in show(), which also runs on hover
        if (n.d.songs && window.Song) Song.play(songChain(n), n.d.kn);
        trackSel(n);
        onChange();
      });
      gRoot.appendChild(g);
    });
    svg.appendChild(gRoot);

    // painted last so it stays above the ring it sits inside: always the way back
    hubDisc = el("circle", { cx: CX, cy: CY, r: R_FULL[0], class: "hubdisc",
      fill: "var(--plate)", stroke: "none" });
    hubDisc.addEventListener("click", e => { e.stopPropagation(); drill(null); });
    svg.appendChild(hubDisc);

    // the hub label lives in the SVG so it scales with the wheel instead of
    // being an HTML overlay sized against the viewport
    hubText = el("g", { class: "hublabel" });
    svg.appendChild(hubText);

    layout(true);
    reset(true);
  }

  /* ------------------------------------------------- geometry per level */
  function targets() {
    const shown = focus ? focus.kids : nodes.filter(n => n.depth === 0);
    const rings = focus ? R_ZOOM : R_FULL;
    const maxLv = rings.length - 2;            // deepest visible level, 0-based
    const base = focus ? focus.depth + 1 : 0;

    const leaves = n => (n.depth - base >= maxLv || !n.kids.length)
      ? 1 : n.kids.reduce((s, k) => s + leaves(k), 0);
    const unit = 360 / (shown.reduce((s, n) => s + leaves(n), 0) || 1);

    // everything starts collapsed into the hub; only the visible subtree opens
    nodes.forEach(n => { n.t = { a0: 0, a1: 0, r0: rings[0], r1: rings[0], o: 0 }; });

    let cursor = 0;
    (function walk(list) {
      list.forEach(n => {
        const lv = n.depth - base, start = cursor;
        if (lv < maxLv && n.kids.length) walk(n.kids);
        else cursor += leaves(n) * unit;
        n.t = { a0: start, a1: cursor, r0: rings[lv], r1: rings[lv + 1], o: 1 };
      });
    })(shown);

    hubDisc.setAttribute("r", rings[0]);
    return rings;
  }

  function draw(n, f) {
    const c = n.cur, t = n.t;
    const g = {
      a0: c.a0 + (t.a0 - c.a0) * f, a1: c.a1 + (t.a1 - c.a1) * f,
      r0: c.r0 + (t.r0 - c.r0) * f, r1: c.r1 + (t.r1 - c.r1) * f,
      o: c.o + (t.o - c.o) * f
    };
    const lift = n === hot ? 4 : 0;
    n.path.setAttribute("d", arc(g.a0, g.a1, g.r0, g.r1 + lift * g.o));
    n.g.style.opacity = g.o;
    // only when it actually flips: this ran 117 times a frame to write the
    // value it already held
    const hit = g.o > .5 ? "auto" : "none";
    if (n.hit !== hit) { n.g.style.pointerEvents = hit; n.hit = hit; }
    return g;
  }

  function place(rings) {
    const fs = focus ? FS_ZOOM : FS_FULL;
    const base = focus ? focus.depth + 1 : 0;
    nodes.forEach(n => {
      const t = n.t, lv = n.depth - base;
      if (!t.o) { n.text.textContent = ""; return; }
      n.text.textContent = english ? shortEn(n.d.en) : n.d.kn;
      const mid = (t.a0 + t.a1) / 2, rMid = (t.r0 + t.r1) / 2;
      const [px, py] = pol(mid, rMid);
      const band = t.r1 - t.r0;
      const chord = 2 * rMid * Math.sin(((t.a1 - t.a0) / 2) * Math.PI / 180);
      // upright wherever there is room for it: radial only on the crowded
      // outer rings of the whole wheel, where a word has nowhere else to go
      const upright = focus || lv === 0;
      if (upright) {
        n.text.setAttribute("x", px); n.text.setAttribute("y", py);
        n.text.removeAttribute("transform");
        n.room = Math.min(band, chord) * .9;
      } else {
        let rot = mid - 90; if (mid > 180) rot += 180;
        n.text.removeAttribute("x"); n.text.removeAttribute("y");
        n.text.setAttribute("transform", `translate(${px} ${py}) rotate(${rot})`);
        n.room = band * .86;
      }
      n.text.setAttribute("font-size", fs[lv]);
      n.text.setAttribute("font-weight", n.depth === 0 ? 600 : 500);
      n.text.setAttribute("fill", INK[n.depth]);
      let len = 0;
      try { len = n.text.getComputedTextLength(); } catch (e) { return; }
      if (len > n.room)
        n.text.setAttribute("font-size", Math.max(7.4, fs[lv] * n.room / len).toFixed(2));
    });
  }

  function layout(animate = true) {
    const rings = targets();
    if (anim) cancelAnimationFrame(anim);
    nodes.forEach(n => { n.text.textContent = ""; });
    const t0 = performance.now(), dur = animate ? 420 : 0;
    (function frame(now) {
      const f = dur ? Math.min(1, (now - t0) / dur) : 1;
      const e = EASE(f);
      nodes.forEach(n => { n.cur = draw(n, e); });
      if (f < 1) anim = requestAnimationFrame(frame);
      else { anim = null; nodes.forEach(n => { n.cur = { ...n.t }; }); place(rings); }
    })(t0);
  }

  const sectorOf = n => { while (n && n.depth > 0) n = n.parent; return n; };

  // there are exactly two states: the whole wheel, or one sector opened out.
  // drilling to a branch would give it 360 degrees to share between two leaves.
  function drill(n, quiet) {
    n = sectorOf(n);
    if (focus === n) return;
    focus = n;
    backBtn.hidden = !n;
    if (n) backBtn.textContent = `← ${wheel.name}`;
    layout();
    reset();
    if (!quiet) onChange();
  }

  /* ------------------------------------------------------ detail panel */
  const shortEn = s => s.split(/[,;(:]/)[0].trim();

  function chain(n) { const c = []; for (let x = n; x; x = x.parent) c.unshift(x); return c; }

  function show(n) {
    svg.classList.add("dimmed");
    const line = chain(n);
    nodes.forEach(o => {
      o.g.classList.toggle("on", chain(o).includes(line[0]) &&
        (line.length === 1 || chain(o).includes(line[1]) || o.depth < line.length - 1));
      o.g.classList.toggle("sel", o === n);
    });
    setHub(n.d.kn, n.d.tr, n.d.en, !!focus);
    detail.innerHTML =
      `<div class="crumb">${line.map((x, i) => i === line.length - 1
        ? `<b>${esc(x.d.kn)}</b>`
        : `<span>${esc(x.d.kn)} <i>${esc(x.d.en)}</i></span>`).join("<em>›</em>")}</div>` +
      `<div class="word">${esc(n.d.kn)}</div>` +
      `<div class="rom">${esc(n.d.tr)}</div>` +
      `<div class="means">${esc(n.d.en)}</div>` +
      (n.d.lit ? `<div class="lit">literally, ${esc(n.d.lit)}</div>` : "") +
      (n.d.sthayi ? `<div class="lit">ಸ್ಥಾಯಿಭಾವ · ${esc(n.d.sthayi)}</div>` : "") +
      (n.d.also ? `<div class="also"><h4>ಹೀಗೂ ಹೇಳುತ್ತಾರೆ · also said</h4><ul>` +
        n.d.also.map(a => `<li><b>${esc(a.kn)}</b> <i>${esc(a.tr)}</i> <span>${esc(a.en)}</span></li>`)
          .join("") + `</ul></div>` : "") +
      (n.d.note ? `<p class="note">${n.d.note}</p>` : "") +
      songCard(n);
    wireSong(n);
  }

  /* A move, not a view. `p` is the word they were on before this one and
     `ms` is how long they stayed there: a pile of view counts cannot tell you
     that readers reach ವಿರಹ from ಪ್ರೀತಿ rather than from ಶೃಂಗಾರ.            */
  function trackSel(n) {
    if (!window.Track) return;
    const now = Date.now();
    Track("sel", { w: wheel.id, k: n.d.kn,
                   p: lastSel, ms: lastSel ? now - lastSelAt : null });
    lastSel = n.d.kn; lastSelAt = now;
  }

  /* --------------------------------------------------------------- song */
  /* Most specific first: this word's song, then the song of the word above it.
     If an id has gone private since it was last checked the player falls to
     the next one, which is the same borrowing the wheel already does for a
     word that never had a song of its own.                                  */
  function songChain(n) {
    const seen = new Set(), out = [];
    const take = list => (list || []).forEach(x => {
      if (!seen.has(x.yt)) { seen.add(x.yt); out.push(x); }
    });

    // The word's own songs first, in the order they are written, because that
    // order is a judgement and shuffling it would throw the judgement away.
    take(n.d.songs);

    // Then the family, shuffled. A parent is supposed to be the superset of
    // everything under it, so its children's songs belong to it too: opening
    // ಕರುಣ should keep going through ಅಳಲು and ಸಂಕಟ rather than stopping. If a
    // child turns out not to belong under its parent, this is where you will
    // hear it.
    const kids = [];
    (function walk(node) {
      (node.kids || []).forEach(k => {
        if (k.songs && !k.songs[0].from) kids.push(...k.songs);
        walk(k);
      });
    })(n.d);
    for (let i = kids.length - 1; i > 0; i--) {      // Fisher-Yates
      const j = Math.floor(Math.random() * (i + 1));
      [kids[i], kids[j]] = [kids[j], kids[i]];
    }
    take(kids);

    // Last, the words above this one, so a leaf with a dead id still has
    // somewhere to fall back to.
    for (let x = n.parent; x; x = x.parent) take(x.d.songs);
    return out;
  }

  function songCard(n) {
    const list = n.d.songs, s = list && list[0];
    if (!s) return "";
    const more = songChain(n).length - 1;   // the whole family, not just this word
    return `<div class="song${s.from ? " borrowed" : ""}">` +
      (s.from ? `<p class="from">ಈ ಪದಕ್ಕೆ ತನ್ನದೇ ಹಾಡಿಲ್ಲ · borrowed from <b>${esc(s.from)}</b></p>` : "") +
      `<button class="play" type="button" aria-pressed="false">
         <img class="art" alt="" loading="lazy" decoding="async"
              src="https://i.ytimg.com/vi/${esc(s.yt)}/mqdefault.jpg">
         <span class="glyph" aria-hidden="true"></span>
         <span class="pt"><b>${esc(s.t)}</b><i>${esc(s.src)}</i></span></button>` +
      `<div class="step">
         <button class="prev" type="button" title="ಹಿಂದಿನ ಹಾಡು">‹</button>
         <span class="pos"></span>
         <button class="next" type="button" title="ಮುಂದಿನ ಹಾಡು">›</button>
       </div>` +
      `<p class="by">${esc(s.by)}</p>` +
      (more > 0 ? `<p class="more">ಮತ್ತೆ ${more} ${more === 1 ? "ಹಾಡು" : "ಹಾಡುಗಳು"} · ` +
        `then ${more} more from this family</p>` : "") +
      `<p class="oops" hidden></p>` +
      `<a class="src" href="https://www.youtube.com/watch?v=${esc(s.yt)}&t=${s.st | 0}"
          target="_blank" rel="noopener">ಯೂಟ್ಯೂಬ್‌ನಲ್ಲಿ ಕೇಳಿ · official / rights-holder upload ↗</a>` +
      `</div>`;
  }

  function wireSong(n) {
    const list = n.d.songs, s = list && list[0], b = detail.querySelector(".song .play");
    if (!b || !s || !window.Song) return;
    const title = b.querySelector(".pt b"), sub = b.querySelector(".pt i");
    const oops = detail.querySelector(".song .oops");
    const sync = (id, err) => {
      // the queue moves on without another click, so the card follows what is
      // actually sounding rather than what was tapped
      const heard = id && list.concat(songChain(n)).find(x => x.yt === id);
      if (heard && title) { title.textContent = heard.t; sub.textContent = heard.src; }
      else if (title) { title.textContent = s.t; sub.textContent = s.src; }
      const on = !!id && !!heard;
      const pos = detail.querySelector(".song .pos"), st = Song.now();
      if (pos) pos.textContent = on && st && st.queue
        ? `${st.rung + 1} / ${st.queue}` : "";
      b.setAttribute("aria-pressed", String(on));
      b.closest(".song").classList.toggle("on", on);
      if (oops) {
        oops.hidden = !(on && err);
        oops.textContent = on && err ? err : "";
      }
    };
    b.addEventListener("click", () => Song.toggle(songChain(n), n.d.kn));
    const step = (fn) => (e) => {
      e.stopPropagation();
      // stepping before anything is playing starts the family from the top
      if (!Song.now()) Song.play(songChain(n), n.d.kn);
      else fn();
    };
    const pv = detail.querySelector(".song .prev"), nx = detail.querySelector(".song .next");
    if (pv) pv.addEventListener("click", step(Song.back));
    if (nx) nx.addEventListener("click", step(Song.skip));
    Song.onChange(sync);
    sync();
  }

  function state() {
    return { open: focus ? focus.d.kn : "", sel: held ? chain(held).map(x => x.d.kn) : [] };
  }

  // restore what a link asks for, silently: never bounce the URL back out
  function apply(open, sel) {
    const o = open ? byName.get(open) : null;
    drill(o || null, true);          // unknown or absent -> back to the whole wheel
    const leaf = sel && sel.length && byName.get(sel[sel.length - 1]);
    if (leaf) { show(leaf); held = leaf; }
  }

  function setHub(word, rom, en, back) {
    const r = focus ? R_ZOOM[0] : R_FULL[0];
    const room = r * 1.62;                      // chord across the disc, with margin
    hubText.textContent = "";
    const rows = [
      { t: word, size: 34, y: en ? -20 : -6, cls: "hw" },
      { t: rom,  size: 15, y: en ? 6 : 18,   cls: "hr" },
      { t: en,   size: 16, y: 28,            cls: "he" },
      { t: back ? "\u2190" : "", size: 22, y: 56, cls: "hb" }
    ];
    rows.forEach(row => {
      if (!row.t) return;
      const t = el("text", { x: CX, y: CY + row.y, class: row.cls,
        "text-anchor": "middle", "dominant-baseline": "central", "font-size": row.size });
      t.textContent = row.t;
      hubText.appendChild(t);
      let len = 0;
      try { len = t.getComputedTextLength(); } catch (e) { return; }
      if (len > room) t.setAttribute("font-size", Math.max(8, row.size * room / len).toFixed(2));
    });
  }

  // one cheap redraw of just the two wedges whose lift changed
  function setHot(n) {
    if (hot === n) return;
    const was = hot; hot = n;
    [was, n].forEach(x => { if (x && !anim) draw(x, 1); });
  }

  function reset(quiet) {
    held = null; setHot(null);
    svg.classList.remove("dimmed");
    nodes.forEach(o => { o.g.classList.remove("on"); o.g.classList.remove("sel"); });
    if (focus) setHub(focus.d.kn, focus.d.tr, focus.d.en, true);
    else setHub(wheel.hubKn, wheel.hubRom, "", false);
    detail.innerHTML = `<p class="hint">${wheel.hint}</p>`;
    if (!quiet) onChange();
  }

  svg.addEventListener("pointerleave", () => { if (!held) reset(); });
  svg.addEventListener("click", e => { if (e.target === svg) { e.stopPropagation(); drill(null); } });
  document.addEventListener("click", e => {
    // clicking a control, or the panel itself, must not drop the selection
    if (held && !e.target.closest(".bar, .switcher, .detail, .zoomout")) reset();
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (focus) drill(null); else reset();
  });
  backBtn.addEventListener("click", e => { e.stopPropagation(); drill(null); });

  function setLang(v) {
    english = v;
    place(focus ? R_ZOOM : R_FULL);
    const keep = held;                 // switching script must not lose the word
    reset(true);
    if (keep) { show(keep); held = keep; }
  }

  window.Wheel = { build, setLang, apply, state,
    isEnglish: () => english,
    onChange: fn => { onChange = fn; } };
})();

/* The song behind a word.

   Two players, not one. A crossfade needs the outgoing song still sounding
   while the incoming one comes up, and a single YouTube player can only hold
   one video at a time: loading the next one cuts the last one dead. So there
   are two, they take turns, and each handover is a real fade across.

   Every play is a standard embed on the rights holder's own channel, so the
   artist gets the view. We host no audio and cache nothing.

   `play` takes a queue: the word's own songs in the order they are written,
   then its family's, shuffled, then the words above it. Tapping ಕರುಣ does not
   play one song, it opens the whole of ಕರುಣ and keeps going through ಅಳಲು and
   ಸಂಕಟ until you stop it.

   The queue is also the fallback. If an id has gone private or had embedding
   switched off since it was checked, the next entry simply takes its turn, so
   a dead link is a track that never plays rather than a silence.            */
(function () {
  const API = "https://www.youtube.com/iframe_api";
  // YouTube will not embed into a page with no real origin. Opened over
  // file:// it answers every request with error 153, so say so plainly.
  const SERVED = /^https?:$/.test(location.protocol);
  const CODES = { 2: "the video id is malformed", 5: "the player failed",
                  100: "the video is gone", 101: "the owner disabled embedding",
                  150: "the owner disabled embedding",
                  153: "no origin: serve the page over http, not file://" };

  const CROSS = 1400, TICK = 60;      // crossfade length, and how often we step
  const listeners = new Set();

  let decks = [], live = 0, ready = false, booted = false;
  let cur = null, err = null, want = null, chain = [], rung = 0;
  let word = null, since = 0, tail = null;   // what is playing, since when

  const other = () => (live + 1) % 2;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function boot() {
    if (booted) return;
    booted = true;
    const s = document.createElement("script");
    s.src = API;
    document.head.appendChild(s);
  }

  /* Warm up on the reader's first touch of the page, not on their first tap
     of a word.

     A cross-origin iframe only has user activation if it existed when the
     gesture happened. Booting inside the first tap means the script loads, the
     players are built a second or two later, and by then the tap is over: the
     video loads and refuses to play. The second tap works because the iframes
     are there to receive it. That is the whole of the first-click bug, and it
     only shows on phones because desktop Chrome hands out autoplay far more
     freely.

     Deliberately not on page load: a reader who opens the wheel and never
     touches it never contacts YouTube at all. The first scroll or touch is
     enough of a head start, and almost nobody taps a sector as their very
     first act.                                                              */
  ["pointerdown", "touchstart", "keydown", "scroll"].forEach(e =>
    addEventListener(e, boot, { once: true, passive: true, capture: true }));

  window.onYouTubeIframeAPIReady = function () {
    decks = [0, 1].map(i => new YT.Player("ytdeck" + i, {
      height: "200", width: "200", videoId: "",
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1, origin: location.origin },
      events: {
        onReady: () => { if (decks.every(d => d && d.loadVideoById)) { ready = true; flush(); } },
        onError: e => { if (i === live) next(CODES[e.data] || "error " + e.data); },
        onStateChange: e => {
          if (i !== live) return;
          if (e.data === YT.PlayerState.ENDED) advance();
          else if (e.data === YT.PlayerState.PLAYING && decks[i].isMuted()) decks[i].unMute();
        }
      }
    }));
  };

  /* -------------------------------------------------------------- fading */
  /* Fix direction and step count up front. Deriving them from the current
     volume each tick overshoots the target, flips, and oscillates forever. */
  function fadeTo(deck, to, ms, done) {
    clearInterval(deck.__fade);
    const from = Math.max(0, Math.min(100, deck.getVolume() || 0));
    if (from === to) { deck.setVolume(to); if (done) done(); return; }
    const steps = Math.max(1, Math.round(ms / TICK));
    let i = 0;
    deck.__fade = setInterval(() => {
      i += 1;
      deck.setVolume(Math.round(from + (to - from) * (i / steps)));
      if (i >= steps) {
        clearInterval(deck.__fade); deck.__fade = null;
        deck.setVolume(to);
        if (done) done();
      }
    }, TICK);
  }

  /* --------------------------------------------------------------- play */
  /* Report the song that is ending before the next one starts. Seconds that
     actually sounded, not seconds the page was open.                        */
  function done() {
    if (!since || !window.Track) { since = 0; return; }
    Track("listen", { k: word, yt: cur, ms: Date.now() - since });
    since = 0;
  }

  function flush() { if (want) { const c = want; want = null; start(c); } }

  function play(songs, forWord) {
    if (forWord !== undefined) word = forWord;
    const list = [].concat(songs).filter(Boolean);
    if (!list.length) return;
    if (!SERVED) {
      cur = list[0].yt;
      err = "ಈ ಪುಟ ಸರ್ವರ್‌ನಿಂದ ತೆರೆಯಬೇಕು · " + CODES[153];
      emit(); return;
    }
    chain = list; rung = 0;
    done();
    boot();
    if (!ready) { want = list; cur = list[0].yt; err = null; emit(); return; }
    start(list);
  }

  /* The next thing in the queue, whether this one ended or never played. */
  function advance(why) {
    if (rung + 1 < chain.length) { rung += 1; start(chain, rung); return; }
    if (why) { err = "ಈ ಹಾಡು ನುಡಿಯಲಿಲ್ಲ · " + why; emit(); }
    else stop();                       // the whole family has played
  }
  const next = advance;

  /* Back one. Restarts the current song if you are already at the head of the
     queue, which is what a back button does everywhere else.                */
  function back() {
    if (!chain.length) return;
    start(chain, Math.max(0, rung - 1));
  }

  /* Move on a crossfade's width before the end, so one song reaches into the
     next instead of stopping dead and starting again. Checked on a timer
     rather than scheduled: a paused or buffering player would make any
     schedule set at play time a lie.                                        */
  function watchTail() {
    clearInterval(tail);
    tail = setInterval(() => {
      const d = decks[live];
      if (!ready || !d || d.getPlayerState() !== 1) return;
      const left = d.getDuration() - d.getCurrentTime();
      if (left > 0 && left <= CROSS / 1000 + 0.4) { clearInterval(tail); advance(); }
    }, 1000);
  }

  function start(list, at) {
    rung = at || 0;
    const song = list[rung];
    const incoming = decks[other()], outgoing = decks[live];
    cur = song.yt; err = null;

    if (window.Track) Track("play", { k: word, yt: song.yt });
    since = Date.now();
    incoming.loadVideoById({ videoId: song.yt, startSeconds: song.st || 0 });
    incoming.unMute();               // it can arrive muted; volume alone will not save you
    incoming.setVolume(0);
    fadeTo(incoming, 100, CROSS);
    if (outgoing && outgoing.getPlayerState && outgoing.getPlayerState() === 1) {
      fadeTo(outgoing, 0, CROSS, () => outgoing.pauseVideo());
    }
    live = other();
    watchTail();

    /* If the player came up without activation it will sit in CUED rather than
       play. Ask once more, explicitly: sometimes the gesture is still live and
       this is all it needed.                                                 */
    const deck = incoming;
    setTimeout(() => {
      if (cur === song.yt && deck.getPlayerState && deck.getPlayerState() !== 1) {
        try { deck.playVideo(); } catch (e) {}
      }
    }, 900);

    emit();
  }

  function stop() {
    done();
    clearInterval(tail); tail = null;
    want = null; chain = []; cur = null; err = null;
    const d = decks[live];
    if (ready && d) fadeTo(d, 0, CROSS / 2, () => d.pauseVideo());
    emit();
  }

  // tapping the card while anything from this queue is sounding means stop
  const toggle = (songs, forWord) => {
    const list = [].concat(songs).filter(Boolean);
    const inQueue = cur && list.some(x => x.yt === cur);
    return inQueue ? stop() : play(songs, forWord);
  };
  const playing = id => cur === id;
  const onChange = fn => listeners.add(fn);

  function emit() {
    const deck = document.getElementById("deck");
    if (deck) deck.hidden = !cur;
    listeners.forEach(fn => fn(cur, err));
  }

  /* What the player is actually doing, which is not always what was asked for:
     for a now-playing line, and for checking by hand that a `start` offset
     lands where you meant it to.                                            */
  function now() {
    const d = decks[live];
    if (!ready || !d || d.getPlayerState() === -1) return null;
    const id = ((d.getVideoUrl() || "").match(/[?&]v=([\w-]{11})/) || [])[1] || null;
    return { yt: id, wanted: cur, at: Math.round(d.getCurrentTime()),
             state: d.getPlayerState(), vol: d.getVolume(), muted: d.isMuted(),
             deck: live, rung: rung, queue: chain.length, error: err,
             // both decks, so a crossfade can be seen to overlap rather than cut
             mix: decks.map(x => [x.getVolume(), x.getPlayerState()]) };
  }

  // skip: the next thing in the queue, for a control on the page and for
  // checking by hand that the queue advances without waiting out a song
  window.Song = { play, toggle, stop, skip: () => advance(), back,
                  playing, onChange, now, esc };
})();

/* Page shell: wheel switching, the language slider, and the URL.

   The address bar always describes exactly what is on screen, so a link can be
   copied mid-thought and it reopens on the same word:

     #w=rasa                                  a wheel
     #w=rasa&open=ಶೃಂಗಾರ                       a sector opened out
     #w=rasa&open=ಶೃಂಗಾರ&sel=ಶೃಂಗಾರ.ಒಲವು.ಪ್ರೀತಿ  and a word selected
     #w=bhava&lang=en                          labels in English

   Words are their own identifiers rather than row numbers, so a link keeps
   working after words.csv is reordered.                                     */
(function () {
  const stage = document.querySelector(".stage");
  const thumb = document.getElementById("thumb");
  const opts = [...document.querySelectorAll(".opt")];
  const langBtn = document.getElementById("langBtn");
  const lopts = [...document.querySelectorAll(".lopt")];
  let current = -1, restoring = false;

  function paint(i, quiet) {
    if (i === current) return;
    current = i;
    const w = WHEELS[i];
    stage.dataset.wheel = w.id;
    document.getElementById("tag").innerHTML = w.tag;
    document.getElementById("mastTitle").textContent = w.name;
    document.getElementById("mastSub").innerHTML = w.blurb;
    document.getElementById("aboutTitle").innerHTML =
      `${w.aboutTitle} <span class="lat">${w.aboutLat}</span>`;
    document.getElementById("aboutBody").innerHTML = w.about;
    document.getElementById("aboutGrid").innerHTML = w.cards
      .map(c => `<div><h3>${c.h}</h3><p>${c.p}</p></div>`).join("");
    opts.forEach((o, j) => o.setAttribute("aria-selected", String(j === i)));
    thumb.style.transform = `translateX(${i * 100}%)`;
    Wheel.build(w);
    if (window.Track) Track("open", { w: w.id });
    if (Wheel.isEnglish()) Wheel.setLang(true);
    if (!quiet) writeUrl();
  }

  /* ------------------------------------------------------------- url */
  function writeUrl() {
    if (restoring) return;
    const s = Wheel.state();
    const bits = [`w=${WHEELS[current].id}`];
    if (s.open) bits.push("open=" + encodeURIComponent(s.open));
    if (s.sel.length) bits.push("sel=" + s.sel.map(encodeURIComponent).join("."));
    if (Wheel.isEnglish()) bits.push("lang=en");
    history.replaceState(null, "", "#" + bits.join("&"));
  }

  function readUrl() {
    const q = new URLSearchParams(location.hash.replace(/^#/, ""));
    const i = Math.max(0, WHEELS.findIndex(w => w.id === q.get("w")));
    restoring = true;
    paint(i, true);
    const wantEn = q.get("lang") === "en";
    if (wantEn !== Wheel.isEnglish()) toggleLang(wantEn, true);
    Wheel.apply(q.get("open") || "", (q.get("sel") || "").split(".").filter(Boolean));
    restoring = false;
  }

  Wheel.onChange(writeUrl);
  window.addEventListener("hashchange", readUrl);

  /* --------------------------------------------------------- controls */
  opts.forEach(o => o.addEventListener("click", () => paint(+o.dataset.i)));
  document.querySelector(".switcher").addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const next = (current + (e.key === "ArrowRight" ? 1 : WHEELS.length - 1)) % WHEELS.length;
    paint(next); opts[next].focus();
  });

  function toggleLang(on, quiet) {
    langBtn.setAttribute("aria-checked", String(on));
    lopts[0].classList.toggle("on", !on);
    lopts[1].classList.toggle("on", on);
    Wheel.setLang(on);
    if (window.Track) Track("lang", { k: on ? "en" : "kn" });
    if (!quiet) writeUrl();
  }
  langBtn.addEventListener("click", () =>
    toggleLang(langBtn.getAttribute("aria-checked") !== "true"));

  readUrl();
})();

/* Register the service worker so the wheel can be installed to a home screen
   and opened without a network. Failure here is not worth a broken page: an
   uninstalled site works exactly as it always did.                          */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

</script>
</body>
</html>
