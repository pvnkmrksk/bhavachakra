# Deploy:
#   cd worker
#   npx wrangler d1 execute bhava-log --remote --file=schema.sql
#   npx wrangler deploy
#
# Reading the data is ./stats.sh, which goes through your Cloudflare login.
# The Worker itself has no read route at all.

name = "bhava-log"
main = "analytics.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
# `binding` is the name the Worker code uses (env.DB). It does not have to
# match the database name, and wrangler's suggested "bhava_log" is only a
# suggestion: what matters is that this line and analytics.js agree.
binding = "DB"
database_name = "bhava-log"
database_id = "9a638d07-3c4c-47ee-8c15-c239ec43d60c"

[vars]
# Only these origins may post. Anything else is refused.
ALLOWED = "https://bhava.kutuhula.in,http://localhost:8732"

# Logs and traces in the dashboard, under the Worker's Observability tab.
# head_sampling_rate = 1 keeps everything, which is right at this traffic.
#
# These are invocation logs: which request arrived, and what it answered. They
# are not the data. Nothing here ever writes a word, an id or an event into a
# log line, and what a reader did is in D1, read with ./stats.sh.
#
# There was a redact_query_string = true here. Wrangler 4.86 does not know the
# field, warns "Unexpected fields found in observability", and deploys without
# it, so it was never doing anything. It is also moot now: no route takes a
# key, so no secret can appear in a URL to be redacted. If you upgrade
# wrangler and later add a route that takes one, put it back.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
