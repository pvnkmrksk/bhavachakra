# Deploy:
#   cd worker
#   npx wrangler d1 execute bhava-log --remote --file=schema.sql
#   npx wrangler deploy
#
# Reading the data is ./stats.sh, which goes through your Cloudflare login.
# The Worker itself has no read route at all.

name = "bhava-log"
main = "analytics.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
# `binding` is the name the Worker code uses (env.DB). It does not have to
# match the database name, and wrangler's suggested "bhava_log" is only a
# suggestion: what matters is that this line and analytics.js agree.
binding = "DB"
database_name = "bhava-log"
database_id = "9a638d07-3c4c-47ee-8c15-c239ec43d60c"

[vars]
# Only these origins may post. Anything else is refused.
ALLOWED = "https://bhava.kutuhula.in,http://localhost:8732"

# Logs and traces in the dashboard, under the Worker's Observability tab.
# head_sampling_rate = 1 keeps everything, which is right at this traffic.
#
# redact_query_string matters here: logs are persisted, and /stats still
# accepts ?key= as a fallback. Without this, the first time anyone opens that
# URL in a browser the key is written into the log in plain text and stays
# there. Use the Authorization header and it never appears at all.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
