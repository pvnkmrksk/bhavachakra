<div class="wrap top">
  <nav class="switcher" role="tablist" aria-label="Choose a wheel">
    <div class="track"><span class="thumb" id="thumb"></span>
      <button role="tab" class="opt" data-i="0" aria-selected="true">
        <b>ಭಾವಚಕ್ರ</b><span>from English</span></button>
      <button role="tab" class="opt" data-i="1" aria-selected="false">
        <b>ಒಡಲ ಚಕ್ರ</b><span>from the body</span></button>
      <button role="tab" class="opt" data-i="2" aria-selected="false">
        <b>ರಸಚಕ್ರ</b><span>from the rasas</span></button>
    </div>
  </nav>

  <div class="bar">
    <p class="tag" id="tag"></p>
    <button class="lang" id="langBtn" role="switch" aria-checked="false"
            aria-label="Wheel labels: Kannada or English">
      <span class="lthumb"></span>
      <span class="lopt on">ಕನ್ನಡ</span><span class="lopt">English</span>
    </button>
  </div>

  <div class="stage">
    <div class="wheelbox">
      <a class="skip" href="#about">Skip the wheel</a>
      <button class="zoomout" id="zoomOut" hidden></button>
      <svg class="wheel" id="wheel" viewBox="0 0 800 800" role="img"
           aria-label="An emotion wheel in Kannada"></svg>
    </div>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>
</div>

<main class="wrap" id="about">
<section>
  <div class="shead">
    <h1 id="mastTitle">ಭಾವಚಕ್ರ</h1>
    <p class="sub serif" id="mastSub"></p>
  </div>
  <div class="shead sub2">
    <h2 id="aboutTitle"></h2>
    <p id="aboutBody"></p>
  </div>
  <div class="method" id="aboutGrid"></div>
  <footer>
    Words checked against <a href="https://rala.kutuhula.in/">rala</a>, a reversal of
    <a href="https://alar.ink">Alar</a> by V. Krishna (ODC-ODbL) combined with Padakanaja,
    Government of Karnataka. alar.ink itself was never queried.
    Every word, its synonyms and the dictionary evidence are listed in the
    <a href="https://github.com/pvnkmrksk/bhavachakra#readme">README</a>.
    Part of <a href="https://kutuhula.in">ಕುತೂಹಲ · kutuhula.in</a>.
  </footer>
</section>
</main>

<!-- The player. Two of them, so one song can fade across into the next.
     Kept at the edge of visibility on purpose: the wheel is for reading and
     the songs are background. `inert` and pointer-events:none put it out of
     reach of the mouse, the Tab key and the screen reader alike, and it stays
     inside the viewport so the browser keeps rendering it. -->
<div class="deck" id="deck" hidden inert>
  <div id="ytdeck0"></div>
  <div id="ytdeck1"></div>
</div>
